# The checks every commit must pass, run where nobody can forget them.
#
# Offline on every push and pull request: the locked environment, lint,
# format, types and the offline suite. The network tests - live providers -
# run nightly and on demand, apart: a provider being down is not a bug in the
# code, and must not turn a commit red.
name: checks

on:
  push:
  pull_request:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  offline:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # The ml extra brings PyTorch (CPU), the stats extra arch and statsmodels
      # (SA11, SA12) and the signatures extra esig, roughpy and scikit-learn
      # (SA13): without them their tests are skipped, not run.
      - run: uv sync --frozen --extra ml --extra stats --extra signatures
      # The rule-based strategies must import and be listed without any extra;
      # this fails the job if a suite was skipped instead of executed.
      - run: uv run python -c "import arch, statsmodels, torch, esig, roughpy, sklearn"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -q

  network:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q -m network
