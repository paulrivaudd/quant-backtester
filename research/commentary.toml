# --- SA12 and SA13: dedicated studies, added on 2026-10-10 after the reports above ---
#
# The two following tables do not come from runs/garch_study. "Fact" there
# means what is read again in the exports of the strategy's own study:
# - SA12: runs/arima_garch_study (scripts/SA12_run_arima_garch_study.py), the
#   run of commit 10f6d90 on store 750c23dfffc3, period 2021-04-01 -> 2026-10-09;
# - SA13: runs/signature_study (scripts/SA13_run_signature_study.py), test
#   period 2023-01-02 -> 2026-10-09, one model a month.
# Their hypotheses, their controls and their statuses were written before the
# first fit (research/hypotheses.toml, commit b0b2d7e). The controls (D0 to
# D2, C0 to C7) are not candidates. The figures of SA13, measured since 2023,
# are not comparable with those of the reports measured since 2021.

[SA12]
period_label = "Common period"
context = "Dedicated study (`scripts/SA12_run_arima_garch_study.py`): the books of the comparison, the EWMA control of SA11 and three controls of SA12 without a catalogue code (D0, D1, D2), executed by the same engine. The ARIMA and the GARCH are re-estimated every evening on 756 open-to-open returns, with a single thread. The hypothesis `sa12_arima_garch`, its controls and its statuses were written before the first fit."
measured_source = "study.md"
history_note = "Columns of SA12 only: the forecast `mu_2`, in basis points, of the return from the open of t + 1 to the open of t + 2; the annualised volatility forecast for this return; the possible fallback of the variance to the EWMA; the gate, read on the weight held that evening; the weight before the 3-point band is applied. The detail of each fit is in the study's `sa12_forecasts.csv`."
summary = "Hold ETF_WORLD only when an ARIMA(1,0,1), re-estimated every evening on 756 open-to-open returns, forecasts more than 20 bp for the return from the open of t + 1 to the open of t + 2 (the position is kept as long as the forecast stays strictly positive), at the weight min(1, 12% / max(σ, 5%)) where σ comes from a GARCH(1,1) fitted on the innovations of the ARIMA. Over this history the forecast crosses the threshold on only 31 evenings out of 1,413, all from 10 April 2025: the book stays in cash for four years, then takes 29 short positions which, together, lose 1.72% net, when the same sizing without the gate (D0) gains 64.07%. The preregistered status is INSUFFICIENT_EVIDENCE because one finished episode is missing (29 for 30 required); the Sharpe gap measured against D0 is -0.99. This says nothing about ARIMA-GARCH models in general."
strengths = [
  "**Fact.** The computation chain works: joint forecast usable at 1,415 decisions out of 1,416 (99.93%), a single ARIMA not converged, no EWMA fallback of the variance.",
  "**Fact.** Maximum drawdown of -6.99% against -21.64% for the fund and -17.77% for D0, volatility of 2.1%. **Reading.** It is the consequence of an average exposure of 4.0% (a position at the close of 69 valuations out of 1,416), not of a lucky choice of sessions.",
  "**Fact.** The book is in cash throughout the fall of the fund from 2025-02-19 to 2025-04-09 (-21.64%). **Reading.** It is not a protection decided by the model: before 10 April 2025 the forecast never exceeded 18.2 bp (13.5 bp from 2021 to 2024), whatever the market, and no position had yet been taken.",
  "**Fact.** Gross of costs, the 29 episodes earn +2.30%.",
  "**Fact.** On the same mean, the GARCH variance has a slightly lower mean joint loss than the EWMA variance (-8.4848 against -8.4737); the paired gap, -0.011, has a 95% interval of [-0.065; +0.045], which contains zero.",
]
weaknesses = [
  "**Fact.** -1.72% net over the period, against +64.07% for D0, +67.43% for SA6 and +94.79% for the fund; Sharpe -0.14. In the second run at doubled costs: -5.70%, Sharpe -0.47.",
  "**Fact.** The forecast of the mean is not better than two naive forecasts: mean squared error of 9.2497e-05, against 9.2133e-05 for the zero forecast and 9.2002e-05 for the mean of the window (the intervals of both gaps contain zero); correlation with the realised return +0.018; right sign 56.1% against 56.7% for \"always up\".",
  "**Fact.** The 31 entry signals do not select better sessions: the average realised return after a signal is +0.046%, against +0.047% over all origins, and 15 signals out of 31 are followed by a rise.",
  "**Fact.** 22 episodes out of 29 last only one valuation: purchase at the open, forecast back to negative or zero that same evening, sale at the next open. 75 orders and 4,022 EUR of costs for about 2,300 EUR of gross gain: the costs exceed the gross gain.",
  "**Fact.** 10 winning episodes out of 29, average net result of -0.05% per episode.",
  "**Fact.** The peak of 2025-05-13 is not back at 2026-10-09, 514 days later (-2.36% below this peak).",
  "**Fact.** Zero score in the ranking of the study: the robustness and implementation blocks are at zero. A zero score is not an economic tie with the other books at zero.",
]
worst = "**Fact.** The deepest fall runs from the peak of 2025-05-13 (100,648.6 EUR) to the trough of 2026-03-26 (93,610.0 EUR): -6.99%, while the fund gains +8.47%. It is not continuous: it is the sum of 16 episodes, of which 3 winners, which cost 2,443 EUR of fees. The heaviest: on the evening of 2025-07-31 the forecast is +20.6 bp and the target 89.5%; the purchase is executed at the open of 2025-08-01 (568.04), the fund closes at 556.13, the evening forecast falls to -21.4 bp and the sale is executed at the open of 2025-08-04 (557.91): -1.75% on the book. On the evening of 2026-03-05 the forecast is +21.2 bp and the target 98.8%; 156 units are bought at the open of 2026-03-06 (617.43); the evening forecast is -6.3 bp and the sale is executed at the open of Monday 2026-03-09 (601.27), 2.65% lower: -2.78% on the book, the worst episode. The evening of 2026-03-18 (+21.7 bp, target 96.1%) likewise leads to a purchase at the open of the 19th and a sale at that of the 20th (-0.87%). The 31 entry signals of the period all follow a positive open-to-open return, of +1.73% on average when the average amplitude of this return is 0.65% over all sessions; since 10 April 2025 the correlation between this last return and the forecast is +0.82. **Reading.** The book therefore buys the day after a strong rise at the open and most often sells one session later; that this mechanism explains the loss, rather than the chance of 16 episodes, is not established."
best = "**Fact.** The largest rise from a trough to a later peak runs from 2026-03-26 to 2026-08-05: +5.46%, against +17.56% for the fund, with an average close weight of 26%. It rests on six episodes, of which four winners. The main one: on the evening of 2026-04-14 the forecast is +22.2 bp and the target 84.8%; the purchase is executed at the open of 2026-04-15 (622.67); the forecast then stays strictly positive for thirteen evenings in a row (between +0.6 and +23.3 bp) and the position is kept, between 80% and 99% of the book; on the evening of 2026-05-05 it goes to -3.8 bp and the sale is executed at the open of 2026-05-06 (645.95): +3.13% on the book in 14 valuations, the longest episode. Then the evening of 2026-07-31 (+29.6 bp, target 89.6%): purchase at the open of 2026-08-03 (682.22), sale at the open of 2026-08-07 (697.95) after a forecast of -2.6 bp on the evening of the 6th: +1.91%. **Reading.** The gains come from the rare episodes held for several sessions in a rise of the fund; the book catches only a fraction of it."
risks = [
  "**Observed.** Choppy market, where a strong open-to-open return is followed by a contrary move: the forecast changes sign from one evening to the next (+148.7 bp on 2025-04-10, -183.9 bp on 2025-04-11, +125.0 bp on 2025-04-14, -46.0 bp on 2025-04-15); the book buys and sells each time and pays the costs twice.",
  "**Observed.** Entry on the eve of a downward gap: bought at the open of 2026-03-06, sold at that of 2026-03-09, 2.65% lower, with 98.8% of the book.",
  "**Observed.** Steady rise of the fund with modest daily returns (2021, 2023, 2024): the forecast stays below the threshold and the book stays in cash while the fund gains +18.4%, +19.6% and +27.1%.",
  "**Plausible.** ARIMA coefficients that change from one window to the next: the annual mean of the estimated autoregressive coefficient goes from -0.17 in 2021 and 2022 to -0.44 in 2025 and -0.67 in 2026, that of the moving-average coefficient from +0.09 to +0.48. The forecasts then become wider, which coincides with the appearance of the signals; the effect on the decision is not isolated here.",
]
measured = [
  "**Fact.** SA12 against D0 (same ARIMA, same variance, gate always open): Sharpe gap of -0.987, 95% bootstrap interval [-2.101; +0.252] at the base costs; -1.241, interval [-2.335; -0.032], in the second run at doubled costs.",
  "**Fact.** SA12 against D1 (same ARIMA, EWMA variance): Sharpe gap of +0.061, interval [-0.037; +0.170]; D1 makes -2.46% net. GARCH and EWMA are not told apart.",
  "**Fact.** D2 (constant mean and GARCH) took no position: a constant mean estimated on 756 returns never exceeds 20 bp per session.",
  "**Fact.** Standardised residuals of the joint forecast: standard deviation 1.04, kurtosis 11.1, autocorrelation of their squares +0.24. The forecast variance accounts neither for all the tails nor for all the persistence.",
  "**Reading.** The direction gate mostly removed exposure: D0, invested at 86% on average, followed the rise of the fund; SA12, invested at 4%, did not follow it. With an interval this wide at the base costs, this gap remains a measure on this path.",
]
to_test = [
  "The INSUFFICIENT_EVIDENCE status is that of the criteria written before the run: 29 finished episodes for 30 required. The threshold was not changed after reading. It says neither that the gate is useful nor that it is harmful; the gap measured against D0 is negative, and its interval at the base costs contains zero.",
  "The entry threshold of 20 bp takes up a reference round-trip cost; it left the strategy idle for four years. Lowering it after reading this result would be a new variant, to be preregistered.",
  "The change over time of the ARIMA coefficients is exported (`sa12_forecasts.csv`) but is not analysed beyond the annual means cited.",
  "The mean and the variance are estimated in two steps, and the two-step variance ignores the uncertainty of the parameters.",
  "The prospective check, configuration frozen, starts at the first XPAR session after 2026-10-10.",
]

[SA13]
period_label = "Test period"
context = "Dedicated study (`scripts/SA13_run_signature_study.py`): one model per variant and per month (46 months, 8 variants), calibrated on what was known on the evening of the last session of the previous month - 1,008 candidate training origins and 126 validation ones, purged at both boundaries - then frozen for the month; a model is assumed available 12 hours after its information cutoff. The period starts at the first month the store allows to be calibrated (cutoff 2022-12-30) and the portfolio is continuous from one month to the next. All the comparable strategies are replayed over this period: their figures are not comparable with those of the reports measured since 2021. The hypothesis `sa13_signatures_neurons`, its eight controls (C0 to C7, without a catalogue code) and its statuses were written before the first fit. A single thread."
measured_source = "study.md"
history_note = "Columns of SA13 only: the month of the model used, whose information stops on the evening of the last session of the previous month; the forecast in basis points and its exact breakdown - reference, displacements of price and of activity, price-volume, price-time and volume-time areas, order-3 group - whose sum is the forecast; the gate, read on the weight held that evening; the weight before the 3-point band; the two realised volatilities of the sizing rule. A contribution to the forecast is not a contribution to the result. The full identifier of each model is in the study's `sa13_history.csv`."
summary = "Hold ETF_WORLD only when a small additive network (4 tanh units per coefficient, 157 parameters), re-estimated every month, forecasts more than 20 bp for the return from the open of t + 1 to the open of t + 2, from the 13 coefficients of the order-3 log-signature of the last 60 sessions of the fund (price, activity, time); the position is kept as long as the forecast stays strictly positive, at the weight of SA6, min(1, 12% / max(σ20, σ60, 5%)). Over the 964 test sessions the book takes 8 positions, is invested at 23.5% on average and loses 3.53% net, when the same sizing without the gate (C0, identical here to SA6 since the coverage is 100%) gains 62.09%. The preregistered status is INSUFFICIENT_EVIDENCE because there are only 8 finished episodes for 30 required; the Sharpe gap measured against C0 is -1.35, with an interval entirely negative. The forecasts have a higher squared error than the training mean and than the Ridge regression on the same coefficients. This says nothing about path signatures in general."
strengths = [
  "**Fact.** The chain works and checks itself: 46 months out of 46 have a calibrated model; 964 decisions out of 964 have an authorised model and usable features; the forecasts exported from the features of the calibration are exactly those the signal of the run computed; each forecast is its reference plus its 13 contributions.",
  "**Fact.** During the fall of the fund from 2025-02-19 to 2025-04-09 (-21.57%), the book loses -15.65%: the weight held goes from 100% to 36%. **Reading.** This reduction comes from the sizing rule of SA6, not from the forecast, which stayed positive throughout the fall.",
  "**Fact.** Over its 63 best consecutive returns (2025-08-01 to 2025-10-29) the book makes +8.86% against +9.57% for the fund, with an average close weight of 95%.",
  "**Fact.** The squared error of SA13 is slightly lower than that of the network on classic indicators (gap of -4.1e-07) and than that of the Ridge on the raw path (-1.3e-06); both intervals contain zero.",
  "**Fact.** The learned functions rarely change sign from one month to the next: at z = ±1 and ±2, the contribution of a coefficient has the sign of its mean in 84 to 86% of the months on average, and in 67% of the months for the price-volume area at z = 2. It is a measure of stability, not of accuracy.",
]
weaknesses = [
  "**Fact.** -3.53% net over the period, against +62.09% for C0 and SA6 and +86.73% for the fund; Sharpe -0.10; -5.11% in the second run at doubled costs. Gross of costs the book already loses 1.95%: the loss does not come first from the costs (1,579 EUR).",
  "**Fact.** Maximum drawdown of -18.56%, deeper than C0's (-15.70%), and not recovered at 2026-10-09, 815 days after the peak of 2024-07-16.",
  "**Fact.** The invested sessions are worse than the sessions in cash: the fund gains on average +3.0 bp per session over the 269 valuations at which the book is invested (+6.6% compounded), against +8.3 bp over the 694 others (+75.0% compounded).",
  "**Fact.** The forecasts are worse than two naive forecasts: mean squared error of 8.7648e-05, against 8.5767e-05 for the zero forecast and 8.5353e-05 for the training mean frozen with each model (gap of +2.3e-06, 95% interval [+1.8e-07; +5.9e-06], above zero); out-of-sample R² -0.027; forecast/realisation correlation -0.035; right sign 52.4% against 57.1% for \"always up\".",
  "**Fact.** The network does worse than the Ridge on the same 13 coefficients: squared-error gap of +1.5e-06, interval [+1.3e-07; +3.5e-06]; the book of the Ridge (C1) makes +11.25% net.",
  "**Fact.** 22 models out of 46 are retained at the last allowed epoch (300): their validation loss was still falling when they stopped.",
  "**Fact.** Only 8 entries in 964 sessions: 88 evenings have a forecast above 20 bp, but 80 of them fall when the book is already invested, and 438 evenings in cash have a forecast between 0 and 20 bp.",
]
worst = "**Fact.** The deepest fall runs from the peak of 2024-07-16 (104,024.9 EUR) to the trough of 2025-04-09 (84,714.7 EUR): -18.56%, against -11.77% for the fund. It contains two long episodes. The first: on the evening of 2024-07-01 the forecast is +20.1 bp (of which +23.5 bp for the order-3 group) and the target 100%; the purchase is executed at the open of 2024-07-02 (518.15). On 2024-08-02 the fund closes at 496.61 after 517.22 the day before; the forecast rises to +47.1 bp, then +58.1 bp on 5 August, and stays positive: the position is kept and only the sizing reduces it, from 100% to 58% on 8 August. The forecast turns negative on the evening of 2024-08-20 (-1.0 bp) and the sale is executed at the open of 2024-08-21 (515.76): -3.15% on the book for this episode, when the fund loses 0.53% close to close. The second: on the evening of 2025-01-31 the forecast is +22.6 bp (order 3: +29.3 bp) and the target 97%; the purchase is executed at the open of 2025-02-03 (584.79). From 2025-02-19 to 2025-04-09 the fund loses 21.57%; the forecast stays positive at the 36 decisions of this fall (between +3.5 and +75.5 bp, +33.4 bp on average), carried by the displacement group (+20.5 bp on average) and by the price-time area (+11.4 bp), while the order-3 group turns negative. The weight held falls from 100% to 36% through the effect of the volatility alone. The forecast turns negative only on the evening of 2025-05-19 (-9.1 bp) and the sale is executed at the open of 2025-05-20 (548.69): -9.46% on the book for this episode of 73 valuations. **Reading.** In these two falls the model forecasts all the more rise as the fund has already fallen: the contribution of the displacements behaves like a bet on mean reversion, which did not pay at the one-session horizon. It is not demonstrated beyond these two episodes."
best = "**Fact.** The largest rise from a trough to a later peak runs from 2025-04-09 to 2026-06-15: +14.13% against +45.06% for the fund, with an average close weight of 34%. It rests first on the end of the previous episode - the book, still invested at 36% at the trough, is sold only on 2025-05-20 - then on the longest episode: on the evening of 2025-07-17 the forecast is +26.3 bp (order 3: +33.3 bp) and the target 94%; the purchase is executed at the open of 2025-07-18 (560.77); the forecast stays positive for 93 valuations, goes to -1.1 bp on the evening of 2025-11-25, and the sale is executed at the open of 2025-11-26 (603.70): +6.75% on the book, when the fund gains 8.24% close to close. The book is then in cash from 2025-11-26 to 2026-06-09, while the fund gains 8.57%. **Reading.** When the book gains, it gains about what the fund gains over the same sessions, less the costs: nothing here shows a choice of sessions better than holding."
