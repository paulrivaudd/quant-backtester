# The written commentary of each strategy, read by scripts/write_strategy_reports.py,
# which writes it into results/<CODE>/analysis.md.
#
# Translated into English on 2026-10-31 from the French text of version 3
# below. No figure, date or conclusion changes; only the number format does
# (21.64% for "21,64 %", 15,730 EUR for "15 730 EUR").
#
# Version 2, of 2026-10-10, rewritten after the independent review
# `revue_analyses_strategies_resultats_10102026.md` (made on commit
# 4e04eae). What changed: the chronologies are given in dates, signals and
# weights as the histories publish them; each point says whether it is a
# measured fact, a reading or an open question; the causal conclusions that
# were not demonstrated were removed or moved to "what remains to be
# measured"; the recovery of the falls and the 50/50 control are cited.
#
# Version 3, of 2026-10-10, after the independent check
# `verification_resultats_corriges_10102026.md` (made on commit ad310bc).
# No global figure changes. What changed: the residual of the attribution of
# SA2 and SA5 is no longer called "execution"; the controls are called
# "constant-target", their realised exposure is cited and the comparison no
# longer claims to isolate the timing; the close-to-open price gap is
# measured again at given quantities and is no longer presented as a cost;
# the still-open stay of SA1 is counted apart; SA14 has two runs at doubled
# costs, frozen model and recalibrated model; the contradictions found one by
# one are corrected (SA2 in 2021 and 2024, threshold of SA3, stays of SA4,
# best episode and groups of SA9, risk control of SA10, slowness of SA11,
# test of the EWMA, sensitivities of SA14).
#
# On 2026-10-11 the catalogued strategy ML1 became SA14: its section is
# called [SA14] and its text names it so. Nothing else changes in it.
#
# Reading conventions, valid everywhere below:
# - "Fact": read again in the exports of runs/garch_study (summary.csv,
#   history_*.csv, fills.csv, comparison.csv, forecast_*.csv), the run of
#   commit 91a2f37 on store b5facce52a6f, period 2021-04-01 -> 2026-10-09. It
#   is the run of 2026-10-11, which adds SA7 and SA8: the figures of the other
#   books are those of run 788507b on store 750c23dfffc3, identical; only
#   their scores move, by less than a tenth of a point (eleven trials instead
#   of ten). The "complementary measures" are read in
#   results/summary/diagnostics.md, version 2, written by
#   scripts/run_review_diagnostics.py on the same store.
# - "Reading": a plausible interpretation of these facts, not demonstrated.
# - A decision is taken on the evening of t (signal and target weight of row
#   t) and executed at the open of t + 1: it appears in the weight held only
#   at row t + 1. The "weight held" is that of the evening valuation. A change
#   in the fund's close between two dates is a move of the underlying, not a
#   loss nor an accounting shortfall.
# - Landmarks: ETF_WORLD held makes +94.8% net (Sharpe 0.93), loses -21.64%
#   from 2025-02-19 to 2025-04-09 and is back at that peak on 2025-10-06, 229
#   days later. The rebalanced 50/50 basket of the two funds makes +103.3% net.
# - None of this is an untouched sample: the history has already been looked at.

[SA1]
summary = "Hold ETF_WORLD above its 20-day moving average, be in cash below it. Over this period the rule strongly cushions the fall of February-April 2025, but this protection is not consistent: its worst fall happens in 2021-2022 despite a reduced exposure, and the repeated switches between cash and the fund, then the fees, erode the result. It remains a yardstick of reactive timing, with no net advantage shown over the fund held: +20.5% net against +94.8%."
strengths = [
  "**Fact.** During the deepest fall of the fund (2025-02-19 to 2025-04-09, -21.64%), the rule loses -6.58%, with an average close weight of 22%.",
  "**Fact.** Volatility of 8.9% against 13.8% for the fund, beta of 0.41.",
  "**Fact.** No estimated parameter: a single indicator, the distance of the price to its MA20.",
]
weaknesses = [
  "**Fact.** One of the most expensive rules, above all relative to the gain obtained: 15,730 EUR of costs and a turnover of 25.5 times the assets a year (only SA5 costs more, 20,517 EUR). Costs are about 43% of the gross gain: +36.2% gross, +20.5% net, and +4.4% in the second actual run at doubled costs.",
  "**Fact.** Its 143 orders almost all concern the whole portfolio: in the fills, the value traded ranges from 0.9 to 1.2 times the initial capital per order.",
  "**Fact.** Zero quality score: the robustness and implementation blocks are at zero, and a single zero block is enough to cancel a geometric mean. This zero is not a zero probability of gain.",
  "**Fact.** Its worst fall (-18.95%) is recovered only on 2024-01-25, 794 days after the peak of 2021-11-22; a second one, started on 2025-11-03 (-10.1% at the trough), is not recovered at 2026-10-09.",
  "**Reading.** The order decided in the evening is executed at the next open: the rule acts after the move that triggered it. The overnight gap can play both ways; its balance is measured below, as a signed close-to-open price gap at given quantities, which is neither a cost paid nor the result of a backtest executed at the close.",
]
worst = "**Fact.** From 2021-11-22 to 2022-07-14, the strategy loses -18.95% while the fund loses -12.0%, with an average close weight of 36%. Over this interval the published weights show 12 switches from cash to the fund and 12 from the fund to cash. April 2022 is its worst month (-5.08% against -2.67% for the fund). **Reading.** Losing more than the fund while invested a third of the time implies having been invested during the relapses and absent from part of the rebounds: that is what round trips around a short average produce in an irregular falling market. The result and the fees of each of these 24 switches are not isolated in this report."
best = "**Fact.** The largest rise from a trough to a later peak runs from 2022-07-14 to 2025-11-03 (+37.3%, the fund +59.1%, average weight 70%): it is a measure of any length, not a position held for three years. The 63 best consecutive returns (2023-11-10 to 2024-02-12, +13.51%) coincide with a window in which the close weight stays at 99.9%: the rule is already invested, no order is executed in it, and the return is very close to the fund's (+13.52% at the close). **Reading.** The rule makes the fund's return when the price stays above its average, and nothing more."
risks = [
  "**Observed.** Irregular falling market (2021-2022): repeated switches between cash and the fund, each paying a round trip.",
  "**Observed.** In 2026, up to 9 October, the rule makes -0.04% when the fund makes +17.7%, with 26 changes of state in the published weights. False signals are a plausible explanation, not quantified here.",
  "**Plausible.** Fast rebound after a crash: the rule is in cash at the low and buys back only once the price is above its average again.",
  "**Observed.** Higher execution costs: at doubled costs the gain almost entirely disappears.",
]
measured = [
  "**Fact.** By stay in the market: 72 stays, of which 71 closed and 1 still open. Of the 71 closed, 28 winners and 43 losers (39.4% winners). The open stay, entered at the valuation of 2026-09-18, is worth +2.96% at 2026-10-09, marked to market, without a final sale or its cost. Over the 72, the open one included: mean net +0.31%, median net -0.28%, worst -6.14%, best +17.48%, for 13 valuations on average; their product gives back the +20.45% of the strategy. **Reading.** The result rests on a few long winning stays, not on the frequency of good signals.",
  "**Fact.** Signed close-to-open price gap, at given quantities: -14,568 EUR net, i.e. -14.6% of the initial capital (favourable gaps +28,201 EUR, unfavourable -42,768 EUR), measured on the market price of the open, hence excluding spread, slippage and commission. It is of the same order as its explicit costs (15,730 EUR) and, by far, the most unfavourable balance of all the books. It is neither a cost paid nor the result of a backtest executed at the close: the signal reads that close, the order could not be executed at it, and another execution price would have changed all the following quantities.",
  "**Reading.** The overnight gaps play both ways, but their balance is clearly unfavourable here: a rule that buys after a close above its average and sells after a close below it executes, on average, after part of the move.",
]
to_test = [
  "The detail of the 72 stays is in `episodes_sa1.csv` (folder of the diagnostics); the 2021-2022 subset is not commented on separately.",
  "The alpha of -1.6% a year remains a point estimate, without an interval.",
]

[SA2]
summary = "Split between ETF_WORLD and ETF_SP500_PEA according to the gap between their 6- and 12-month momentums, the last 21 sessions excluded, and leave a fund whose 12-month momentum is not positive. During the fall of 2025 the rule reduces its tilt towards the S&P 500 but keeps an almost full equity exposure; its exit to cash in May comes afterwards, during the recovery. +69.2% net against +94.8% for the fund and +103.3% for the 50/50 basket of the same funds."
strengths = [
  "**Fact.** Two years above the fund held: +21.2% in 2021 (partial) and +30.7% in 2024, against +18.4% and +27.1%.",
  "**Fact.** The 63 best consecutive returns (2026-03-31 to 2026-07-01) make +17.2%, against +16.3% for the fund.",
  "**Fact.** The split between the two funds adapts: the weight of the S&P 500 fund goes from 66.9% on 2025-02-19 to 50.1% on 2025-04-09.",
]
weaknesses = [
  "**Fact.** These two good years slightly beat the 50/50 basket, which already makes +20.74% in 2021 (partial) and +30.19% in 2024, against +21.21% and +30.73% for the rule: about 0.47 and 0.54 point ahead, with no demonstration of statistical superiority. **Reading.** The lead over the world fund therefore rests mostly on the basket held, which already does 2.3 and 3.1 points better than it, not on the momentum.",
  "**Fact.** Over the whole period the rule makes +69.2% net against +103.3% for the 50/50 basket; its 4,629 EUR of costs explain only a small part of this 34-point gap.",
  "**Fact.** Maximum drawdown of -22.78%, deeper than the fund's (-21.64%), recovered only on 2026-04-17, 422 days after the peak (229 days for the fund).",
  "**Fact.** -17.6% in 2022 (fund -13.7%), then +9.1% in 2023 (fund +19.6%); its longest stretch below a peak lasts 807 days, from 2022-01-04 to 2024-03-21.",
  "**Fact.** Sharpe of 0.78, then 0.72 in the second run at doubled costs; alpha of -1.0% a year, without an interval.",
]
worst = "**Fact.** From 2025-02-19 to 2025-04-09, the strategy loses -22.78% with a total close weight of 100% from start to finish. Over this interval the S&P 500 fund loses -23.3% at the close and the world fund -21.7%, and the rule brings the first one down from 66.9% to 50.1% of the portfolio. **Reading.** The rule adapted its split, not its total exposure: the eligibility conditions, which read momentums stopped 21 sessions earlier, stay positive throughout the fall. **Fact.** What follows weighs as much: the strategy is entirely in cash from 2025-05-09 to 2025-05-26 and takes a position again on 27 May; between these two closes the world fund rises by +3.4%. The year 2025 ends at +0.6% against +6.6% for the fund."
best = "**Fact.** The largest rise from a trough to a later peak runs from 2023-05-04 to 2026-10-06 (+74.3%, average weight 96%): any length, not a single signal. The best rolling quarter (2026-03-31 to 2026-07-01, +17.2% against +16.3%) has a close weight of 100%. Its largest relative lag runs from 2022-07-14 to 2025-05-16: +18.1% against +43.7% for the fund, a relative gap of -17.8%. **Reading.** This lag adds up the exit of 2022, the return of 2023 and the exit of May 2025."
risks = [
  "**Observed.** Fast fall from highs (February-April 2025): the long momentums, read with a lag of 21 sessions, stay positive and the total exposure stays at 100%.",
  "**Observed.** Recovery after a fall (early 2023, May 2025): the rule is in cash or under-invested when the market rises again.",
  "**Plausible.** Reversal of leadership between the United States and the rest of the world: the tilt follows the fund that rose best.",
]
measured = [
  "**Fact.** Approximate attribution against the 50/50 basket, in log returns over the period: basket +0.727; total exposure -0.140; choice between the two funds +0.004; residual of the approximation at the close weights -0.039; costs -0.027; i.e. +0.526 for the strategy, against +0.710 for the basket executed by the engine. The first three terms value the weights held at the previous close with the close-to-close return, which is not how the book traded.",
  "**Reading.** In this approximation the contribution of the total exposure is negative and that of the choice between the funds, the object of the relative momentum, close to zero; the costs weigh 2.7 log points. The residual is not a measure of the execution: it also contains the return of the day on what was bought or sold that very morning, hence part of the effect of the signal. These terms are not the full contribution of a timing, and an exact attribution remains to be made.",
  "**Fact.** Signed close-to-open price gap, at given quantities: -1,838 EUR net. It is neither a cost paid nor the result of a backtest executed at the close.",
]
to_test = [
  "An exact attribution, from the quantities before and after each fill and the opening prices (quantities before times the close-to-open gap, quantities after times the open-to-close gap, then the fees), compared with that of the 50/50 basket: it is not produced here.",
  "The eligibility dates of each fund, to date the exits to cash one by one.",
]

[SA3]
summary = "Exposure to ETF_WORLD proportional to the gap between its 50- and 200-day moving averages: cash when the MA50 is below the MA200, 100% from a gap of 2%, continuously in between. In 2025 the rule takes almost the whole fall up to 9 April, then reduces progressively from 11 to 22 April, then stays in cash for 84 sessions: no protection from the fall, then a weak participation in the rebound. +57.9% net, and the cheapest rule of the catalogue."
strengths = [
  "**Fact.** 78 orders in five and a half years, 680 EUR of costs, a turnover of 0.98 times the assets a year; +56.9% in the second run at doubled costs.",
  "**Fact.** -9.1% in 2022 against -13.7% for the fund; from 2022-04-05 to 2022-06-17 it is in cash while the fund loses -15.0%.",
  "**Fact.** Alpha of +0.4% a year for a beta of 0.65: a point estimate, without an interval, which does not demonstrate a premium.",
]
weaknesses = [
  "**Fact.** Maximum drawdown of -21.64%, the same as the fund's, but recovered only on 2026-08-13: 540 days after the peak, against 229 for the fund. It is its most instructive weak point.",
  "**Fact.** -9.6% in 2025 while the fund ends at +6.6%; April 2025 is its worst month (-8.0% against -3.9%).",
  "**Fact.** +8.6% in 2023 against +19.6%; 748 days below the peak of 2022-01-04.",
  "**Fact.** 12 months out of 67 without any change: the rule spends long stretches entirely in cash.",
]
worst = "**Fact.** From 2025-02-19 to 2025-04-09 the strategy loses -21.64%, with a close weight of 100%. The two averages move during these 35 returns, but their gap stays close enough to the threshold of full exposure (2%) for the target to stay high and for the band to keep the position: on 9 April it is still +1.94%. The exit is progressive and comes after the trough: close weight of 99.9% on 10 April, 80.1% on the 11th, 62.1% on the 14th, 46.1% on the 15th, 30.5% on the 16th, 14.9% on the 17th, 0% on the 22nd. The target falls before the crossing, seen on 17 April (gap of -0.05%). The portfolio then stays at zero for 84 sessions, from 2025-04-22 to 2025-08-18, comes back in at 2.7% on 19 August and returns towards 100% only at the end of September. Between the closes of 22 April and 19 August the fund rises by +18.1%: it is a move of the underlying, not an accounting loss of SA3."
best = "**Fact.** The largest rise from a trough to a later peak covers almost the whole period (2021-05-19 to 2026-10-06, +62.2% against +100.2% for the fund): any length, and it contains the exits of 2022 and 2025. The 63 best consecutive returns (2026-03-31 to 2026-07-01, +16.25%) have an average close weight of 99.7%, no order executed, and a return almost equal to the fund's (+16.29%). **Reading.** The rule gains when there is nothing to do."
risks = [
  "**Observed.** Fast fall from highs then rebound (2025): the whole fall is taken, the exit comes after the trough, the return after the recovery; the recovery is lengthened by ten months compared with the fund.",
  "**Plausible.** Gap between the averages oscillating near zero: the rule being continuous (a gap of 0.1% gives 5% exposure before the band), it does not alternate between 0 and 100%, but small repeated adjustments can cost.",
  "**Observed.** Recovery after a long falling market (2023): the return to exposure comes several months after the low.",
]
measured = [
  "**Fact.** Beside a constant-target control at 71.5% of the fund (its average weight), with the same 3-point band and the same costs: the control makes +63.2% net, Sharpe 0.93, maximum drawdown -15.9%, peak back in 226 days, 7 orders and 94 EUR of costs, for an average realised exposure of 72.2%; SA3 makes +57.9%, Sharpe 0.79, -21.6%, 540 days, for 71.5%.",
  "**Reading.** Over this period SA3 does worse than this control, in return as in risk. The comparison describes two executable rules and does not isolate, at exactly the same exposure, the value of the timing of the two averages: the level of exposure, the costs and the path change too. The control is chosen after the fact: it is an observation, not a rule that could have been set in advance.",
  "**Fact.** Signed close-to-open price gap, at given quantities: -645 EUR net, the smallest of all the books in absolute value. It is neither a cost paid nor the result of a backtest executed at the close.",
]
to_test = [
  "The result of the exit sequence alone, from 11 to 22 April 2025, is not isolated from the rest.",
]

[SA4]
summary = "Buy ETF_WORLD, up to 50% at most, after a five-session fall that is unusual relative to its volatility, only above its 200-day average. The small loss of the portfolio comes largely from how rarely it invests: a position is held at only 198 closes out of 1,416. When it is active, the pocket can reach 50% and buy a settling fall several times. +4.4% net in five and a half years, concentrated in 2024."
strengths = [
  "**Fact.** At the level of the whole portfolio: volatility of 1.9%, maximum drawdown of -3.42%, beta of 0.05.",
  "**Fact.** From 2025-02-19 to 2025-04-09 it loses -2.92% when the fund loses -21.64%, with an average close weight of 10%.",
  "**Fact.** Alpha of +0.18% a year against the fund: practically zero, without an interval. It does not demonstrate that the dips bought paid on average.",
]
weaknesses = [
  "**Fact.** The volatility of 1.9% is that of a portfolio in cash 86% of the time. The risk carried when the signal is active is that of a position of up to 50.4% of the capital.",
  "**Fact.** +9.0% gross, +4.4% net for 237 orders and 4,572 EUR of costs; -0.16% in the second run at doubled costs.",
  "**Fact.** Its maximum drawdown, though only -3.42%, is not recovered at 2026-10-09 (589 days); the previous one (-2.55%) lasted 1,039 days, from 2021-10-05 to 2024-08-09.",
  "**Fact.** 28 positive months, 14 negative and 25 unchanged. The result depends on 2024 (+5.5%): the product of the returns of the other years is about -1.0%. It is not a new backtest, it is an indicator of concentration.",
  "**Fact.** Zero quality score, through the robustness and implementation blocks.",
]
worst = "**Fact.** From 2025-02-27 to 2025-03-07 the strategy loses -3.42% while the fund loses -7.0% at the close. It is not a single purchase kept to the end: the close weight is 12.7% on 28 February, 49.9% on 3 March, 4.9% on the 4th, then again 49.4% on the 5th, 49.5% on the 6th and 49.0% on the 7th. The rule lightens when the signal weakens, then buys back after a new fall. On 7 March the price goes below its MA200: the evening target is zero, but the weight held is still 49.0%, and the cash is seen only on 10 March, after execution at the open. **Reading.** The trend filter does not protect at the close of the crossing, and a dip purchase does not tell a dip from the start of a lasting fall."
best = "**Fact.** The largest rise from a trough to a later peak runs from 2024-04-19 to 2025-02-27 (+6.1%, the fund +20.7%, average weight 6%): a series of short episodes, not a position. The best rolling quarter (2024-09-06 to 2024-12-04) makes +2.9%. **Reading.** In a steady rise, the dips of a few sessions were followed by a return towards the highs; the success rate and the net gain of the stays of this window alone are not isolated here; those of the 71 stays of the whole period are in the complementary measures."
risks = [
  "**Observed.** Start of a lasting fall while the price is still above its MA200 (March 2025): the pocket buys at full size, sometimes twice, and the exit comes at the open following the crossing.",
  "**Plausible.** Fall through successive overnight gaps: the sale is executed after the gap.",
  "**Observed.** Fees: at doubled costs the gain disappears.",
]
measured = [
  "**Fact.** By stay: 71 stays, all closed, of 2.8 valuations on average, 47 winners and 24 losers (66%); mean net +0.06%, median net +0.04%, worst -2.92%, best +1.85%. The stays were therefore winners two times out of three, for an average net gain of about 6.3 basis points per stay, after 64 EUR of costs on average.",
  "**Fact.** It is the only book whose signed close-to-open price gap, at given quantities, is positive: +2,303 EUR net (favourable gaps +14,660 EUR, unfavourable -12,358 EUR). It is neither a cost paid nor the result of a backtest executed at the close: this balance is not a gain collected.",
  "**Reading.** The stays have a positive historical average net gain, of about 6.3 basis points; a premium specific to the signal is not established without an exposure control or a measure of uncertainty. It would be thin: half of the gross gain goes in costs, and the worst stay wipes out nearly fifty average stays.",
]
to_test = [
  "These frequencies are given without an interval; 71 stays concentrated in a few years do not make an independent sample.",
  "The rule as a pocket of a portfolio already invested, rather than alone against cash.",
]

