[SA6]
summary = "Hold ETF_WORLD at min(1, 12% / max(20-day vol, 60-day vol, 5%)). Over this history the rule reduces the risk at the price of a lower exposure and return: +67.4% net, Sharpe 0.90, maximum drawdown of -15.7% instead of -21.6%. Its advantage over SA11 rests here on a slower return to risk and lower costs, with no general proof of superiority."
strengths = [
  "**Fact.** Maximum drawdown of -15.72% against -21.64% for the fund, volatility of 10.9% against 13.8%, Sharpe of 0.90 against 0.93.",
  "**Fact.** 180 orders, 1,445 EUR of costs, turnover of 2.1 times the assets a year; +65.5% and a Sharpe of 0.88 in the second run at doubled costs.",
  "**Fact.** On 2025-04-02, on the eve of the second wave, its close weight is 65.0%, against 77.7% for SA11 and 67.2% for the EWMA control.",
  "**Fact.** Third in the common ranking (52.0%). The gap with the EWMA control (53.6%) and SA11 (48.7%) is not a test of superiority.",
]
weaknesses = [
  "**Fact.** +67.4% against +94.8% for the fund: average close weight of 84.7%. The alpha of +0.03% a year is practically zero and without an interval: it is a tool for reducing risk, not a demonstrated creation of alpha.",
  "**Fact.** The fall is shallower but longer to erase: peak back on 2026-01-15, 330 days later, against 229 days for the fund.",
  "**Fact.** +1.6% in 2025 against +6.6%: the close weight stays between 28% and 41% from 2025-04-15 to 2025-05-19, during the recovery.",
  "**Reading.** The rule forecasts neither the direction of the market nor the onset of a shock: past realised volatility serves as an estimator of the risk to come, and the adjustment is reactive. On 2025-02-19 the larger of the two estimates is 11.1% and the weight is 99.7%.",
]
worst = "**Fact.** From 2025-02-19 to 2025-04-09 the strategy loses -15.72% against -21.64% for the fund, with a close weight going from 100% to 36%. The first reduction follows the signal of 4 March (target of 72.7%) and appears in the portfolio on 5 March (72.6% instead of 99.7%). The weight then falls towards 60% at the end of March, is 65.0% on 2 April and 41.3% on 7 April. Over the 63 worst consecutive returns (2025-01-21 to 2025-04-22) it loses -12.65% against -16.75% for the fund. **Reading.** The memory of the long estimator slows the return to risk after the first shock, which protects before the second wave and then limits the participation in the rebound; it does not prevent it, as the observations leave the window progressively."
best = "**Fact.** The largest rise from a trough to a later peak covers almost the whole period (2021-05-19 to 2026-10-06, +72.0% against +100.2%). Over the 63 best consecutive returns (2023-10-30 to 2024-01-30, +15.08% against +15.58%), the close weight is 98% on average and goes down to 85.0%; the short estimate rises to 14.2% and the larger of the two exceeds 12% at 14 valuations. Five orders are executed in it, for 29 EUR of costs. **Reading.** An estimated risk generally low enough to keep a high exposure."
risks = [
  "**Observed.** Sudden shock in a calm market: weight close to 100% at the time of the shock, the reduction is executed after the first loss.",
  "**Observed.** Fast rebound after a panic: the weight stays low for several weeks during the recovery, and the recovery is longer than the fund's.",
  "**Plausible.** Long regime of volatility above 12% in a rising market: lasting under-investment.",
]
measured = [
  "**Fact.** Beside a constant-target control at 84.7% of the fund (its average weight), with the same 3-point band and the same costs: the control makes +78.0% net, Sharpe 0.93, maximum drawdown -18.5%, peak back in 229 days, 97 EUR of costs, for an average realised exposure of 86.1%; SA6 makes +67.4%, Sharpe 0.90, -15.7%, 330 days, for 84.7%.",
  "**Reading.** At a comparable but not identical exposure, SA6 has a maximum drawdown 2.8 points smaller than this control's, for 10.6 points less return, a slightly lower Sharpe and a recovery a hundred days longer. The comparison describes two executable rules and does not isolate, at exactly the same exposure, the value of the timing: the control carried 1.4 points more exposure on average. It is chosen after the fact.",
  "**Fact.** SA6 against the EWMA control: Sharpe difference of -0.036, 95% bootstrap interval [-0.104; +0.027]. The two are not told apart.",
  "**Fact.** Signed close-to-open price gap, at given quantities: -2,503 EUR net. It is neither a cost paid nor the result of a backtest executed at the close.",
]
to_test = [
  "A control at equivalent risk set in advance, rather than at the average weight observed.",
]

[SA7]
summary = "Split the capital between three style funds - iShares Edge MSCI World Value, Quality and Minimum Volatility - half in equal parts and half in inverse proportion to their volatility over 60 returns, each fund capped at 40%. The rule holds an almost constant basket, about a third in each fund, and rebalanced only nine times. Its result, +60.2% net against +94.8% for the world fund, is not the rule's on complete data: seven times it sold everything because a price was missing, twice for some sixty sessions."
context = "Funds listed on Xetra, in euros, served by a single provider and not cross-checked by a second source. The run is made on the Paris calendar: a session that Paris holds and Xetra does not is valued at the last known price."
strengths = [
  "**Fact.** Volatility of 10.8% against 13.8% for the world fund, maximum drawdown of -16.36% against -21.64%, beta of 0.72.",
  "**Fact.** Fifth in the common ranking (49.8%), between SA10 (51.1%) and SA3 (49.1%); these gaps are not a test.",
  "**Fact.** -8.3% in 2022 against -13.7% for the world fund and -14.0% for the 50/50 basket.",
  "**Fact.** The rule itself trades little: nine rebalancings in five and a half years, 27 orders, 76 EUR of costs. +57.7% net and a Sharpe of 0.80 in the second run at doubled costs.",
]
weaknesses = [
  "**Fact.** +60.2% against +94.8% for the world fund; behind it in every rising year (+14.1% against +18.4% in 2021, +13.0% against +19.6% in 2023, +17.7% against +27.1% in 2024, +9.1% against +17.7% in 2026). Alpha of -0.2% a year, information ratio of -0.66, without an interval.",
  "**Fact.** 91% of its costs (1,808 EUR out of 1,983) come from seven complete exits that the rule did not decide on a market signal: it holds nothing as soon as a close is missing for one of the three funds.",
  "**Fact.** Five of these exits last one session and follow a session that Paris held and Xetra did not (Whit Monday 2021, 24 and 31 December 2021 and 2024): everything is sold at the next open and bought back the day after, 30 orders for 1,215 EUR.",
  "**Fact.** The other two follow the two sessions the provider does not serve (2025-10-24 and 2026-03-06): the window of 61 consecutive closes is broken, and the book stays in cash for 62 then 60 valuations, from 2025-10-28 to 2026-01-26 and from 2026-03-10 to 2026-06-04.",
  "**Fact.** During these two absences the three funds make, at the close: Value +9.3% then +29.4%, Quality +2.5% then +8.2%, Minimum Volatility -1.2% then -2.0%. The book, from the eve of each exit to the day of the buy-back, makes -0.8% then +1.2%.",
]
worst = "**Fact.** From 2025-02-27 to 2025-04-09 the strategy loses -16.36% with a close weight of 99% from start to finish, when the world fund loses -20.0% at the close; it is back at its peak on 2025-10-27, 242 days later. Over the 63 worst consecutive returns (2025-01-10 to 2025-04-09) it loses -11.86% against -18.17%. **Reading.** The rule never reduces its exposure: the smaller loss comes from the funds held, which fell less than the world fund, not from a decision taken during the fall."
best = "**Fact.** The largest rise from a trough to a later peak covers almost the whole period (2021-05-19 to 2026-10-07, +63.3% against +99.7% for the world fund). Over the 63 best consecutive returns (2025-04-09 to 2025-07-10) it makes +12.54% against +19.34%, fully invested. Its largest relative lag runs from 2023-01-06 to 2026-06-02: +39.6% against +75.9%, a relative gap of -20.6%. **Reading.** The basket of the three styles rises less than the world fund in the rises of this period, and the end of this lag coincides with the second absence of the book."
risks = [
  "**Observed.** Rising market carried by stocks the three styles underweight (2023, 2024): the basket follows with a beta of 0.72.",
  "**Observed.** A missing close on a single one of the three funds: the rule exits entirely, for one session or for sixty.",
  "**Plausible.** Simultaneous rise of the volatilities: the inverse-proportion part changes almost nothing when all three rise together, and nothing reduces the total exposure.",
]
measured = [
  "**Fact.** Signed close-to-open price gap, at given quantities: +3,015 EUR net (favourable gaps +6,602 EUR, unfavourable -3,587 EUR). It is neither a gain collected nor the result of a backtest executed at the close, and most of its orders are those of the seven exits described above.",
  "**Fact.** Weights held on average over all valuations: 32.5% of Minimum Volatility, 29.2% of Value, 29.1% of Quality, the rest in cash (average exposure 90.9%).",
]
to_test = [
  "The same run with decisions taken only at the sessions Xetra holds: the five one-session exits are an effect of the reference calendar, not of the rule.",
  "What the rule would have done without the two missing sessions is not measured: no second source serves these funds, and a price is never rebuilt.",
  "The comparison its specification asks for, with the equal weighting of the same three funds, is not produced.",
  "The three funds were chosen on 2026-10-11 after the data control refused three Paris funds; this choice precedes the first run, but their history already existed.",
]

[SA8]
summary = "Place all the capital in a euro money-market fund - Xtrackers II EUR Overnight Rate Swap - when its return over the last 63 sessions, annualised, covers a round-trip cost of 0.20% in one quarter and its volatility stays below 2%. The rule stays in cash as long as rates are negative or too low, buys the fund on 2022-12-05 and keeps it: +10.5% net. It has no rank: it is a cash investment, and its Sharpe of 7.1 is not comparable with that of an equity strategy."
context = "Funds listed on Xetra, in euros, served by a single provider and not cross-checked by a second source. The run is made on the Paris calendar: a session that Paris holds and Xetra does not is valued at the last known price. SA8 is reported outside the ranking: with a zero risk-free rate, the Sharpe of a money-market fund is that of a price that hardly moves; counted among the trials, it multiplied by six the dispersion that deflates the scores and brought all the others down to about 1%."
strengths = [
  "**Fact.** Volatility of 0.25% and maximum drawdown of -0.35%.",
  "**Fact.** In cash from 2021-04-01 to 2022-12-02, while the money-market fund loses value (from 135.72 to a low of 134.64 on 2022-08-04): the rule does not buy a negative carry. Its signal turns positive on 2022-10-04 and the purchase is executed on 2022-12-05, at 134.95.",
  "**Fact.** +3.3% in 2023, +3.6% in 2024, +1.8% in 2025, +1.4% in 2026 up to 9 October: the fund's return once held.",
]
weaknesses = [
  "**Fact.** +10.5% net in five and a half years against +94.8% for the world fund: the rule carries no equity risk, it is not an alternative to an equity fund.",
  "**Fact.** 963 EUR of costs for 9 orders, about 8% of the gross gain (+11.4% gross, +10.5% net). The initial purchase costs 100 EUR; the other eight orders, 863 EUR, are four sales each followed by a buy-back the next day.",
  "**Fact.** These four round trips follow 24 and 31 December 2024 and 2025: Paris holds a session, Xetra does not, the fund has no close, the signal cannot be read and the rule then targets cash. They are its two deepest falls (-0.33% and -0.35%).",
  "**Fact.** +9.5% net in the second run at doubled costs, in which these round trips cost twice as much.",
]
worst = "**Fact.** From 2025-12-24 to 2026-01-05 the strategy loses -0.35%: it sells on 2025-12-29, buys back on the 30th, sells on 2026-01-02 and buys back on the 5th, for 435 EUR of costs, while the fund's price rises from 148.01 to 148.12. The peak is back on 2026-03-09, 75 days later. The same sequence a year earlier costs -0.33%. **Reading.** This loss is entirely an execution cost caused by two sessions without a price, not a move of the fund."
best = "**Fact.** The largest rise from a trough to a later peak runs from 2022-12-05 to 2026-10-09 (+10.57%): it is the holding of the fund since the purchase. Over the 63 best consecutive returns (2023-12-06 to 2024-03-07) it makes +1.06%, when the annualised return read by the signal is close to +3.9%. **Reading.** The rule produces nothing more than the money-market rate, which is its purpose."
risks = [
  "**Observed.** A session without a price of the fund: the rule sells and buys back, and each round trip costs about 0.2% of the capital.",
  "**Observed.** Negative or zero rates (2021-2022): the rule stays in cash, which earns nothing here.",
  "**Plausible.** Fast fall of rates: the carry is measured over the past 63 sessions and is slow to see it.",
]
measured = [
  "**Fact.** Signed close-to-open price gap, at given quantities: +47 EUR net. On a money-market fund the gap between a close and the next open is of the order of one night's return.",
  "**Fact.** Annualised return read by the signal: +1.2% at the end of 2022, +3.2% in mid-2023, +3.9% at the end of 2023, +3.8% in mid-2024, +3.3% at the end of 2024, +2.2% in mid-2025 and at 2026-10-09.",
  "**Fact.** Invested at 979 valuations out of 1,416; the fund itself makes +10.9% over the whole period and +11.5% since the purchase price.",
]
to_test = [
  "The same run with decisions taken only at the sessions Xetra holds: the four round trips would disappear, and with them 863 EUR of costs out of 963.",
  "A Sharpe computed against the money-market rate, and not against zero: it would be close to zero, and it is the measure that would allow it to be ranked.",
  "Its intended role, placing the capital SA10 leaves in cash: SA10 is still run without it.",
  "Six bars of the fund, flat and without volume, are kept as served over the period; no second source arbitrates them.",
]

[SA9]
summary = "Buy the S&P 500 fund at 50% when the VIX has fallen back to 80% or less of a recent peak of at least 30 and the fund is rising over five sessions. SA9 avoids the fall of February to early April 2025 by staying in cash, but its first attempt at the recovery, from 15 to 22 April, loses money; the second is profitable, closed in May, then the portfolio stays idle for nearly eleven months. The main risk is the false calm, observed in 2022 and again in 2025. -0.7% net."
strengths = [
  "**Fact.** In cash from 2025-02-19 to 2025-04-09: no change during the deepest fall of the fund (-21.64%).",
  "**Fact.** A position is held at only 104 closes out of 1,416; volatility of 2.3% and beta of 0.05 at the level of the whole portfolio.",
  "**Fact.** The sequence opened on 2025-04-28 and closed on 2025-05-21 is profitable: the value goes from 92,753 EUR on 22 April to 96,131 EUR on 21 May.",
]
weaknesses = [
  "**Fact.** -0.70% net, +1.34% gross: the 2,041 EUR of costs exceed the gross gain. -2.8% in the second run at doubled costs; Sharpe of -0.04; zero score.",
  "**Fact.** The beta of 0.05 hides the intermittence: when it is invested, the rule carries between 49% and 53% of the capital on a single fund.",
  "**Fact.** 8 positive months, 7 negative and 52 unchanged out of 67. April 2025, the month of the panic the rule is meant to exploit, is its worst month (-2.68%).",
  "**Fact.** Its maximum drawdown (-8.00%), started from the peak of 2022-03-29, is still not recovered at 2026-10-09: 1,655 days.",
  "**Fact.** 42 fills, i.e. 21 entry and exit sequences: too few to judge, and they are not 21 independent panics.",
]
worst = "**Fact.** The deepest fall runs from 2022-03-29 to 2025-04-28 (-8.00%, average close weight 3%): losses taken in fits and starts and never made up. Its core is spring 2022 (2022-03-31 to 2022-06-30, -4.84%). The trough itself comes from a false start in 2025: in cash until 14 April (95,272 EUR), the rule opens a position seen on 15 April and exits it on the 22nd (92,753 EUR), i.e. -2.64% in a week. **Reading.** In both cases an easing of the VIX is followed by a relapse: the rule buys the relief at 50% and sells lower."
best = "**Fact.** The largest rise from a trough to a later peak runs from 2025-04-28 to 2026-04-29 (+7.53%), but it is not a position held for a year. Its origin, the close of 28 April (92,347.82 EUR), is the first evening of the second entry and already contains a loss of that entry: the portfolio was worth 92,753.47 EUR before it, after the false start from 15 to 22 April. The full stay of this second entry, exited on 21 May 2025 at 96,131.21 EUR, earns +3.64%; measured from the trough of 28 April, the same move gives the +4.10% of the 63 best consecutive returns, entirely acquired on 21 May. The portfolio then stays in cash, at exactly 96,131.21 EUR, until 2026-04-02; new positions taken in April 2026 add +3.30% from this plateau. **Reading.** The trough that serves as the origin of this measure is chosen after the fact: the story of a rebound caught without a hitch erases the failure of the week before and the loss of the first day."
risks = [
  "**Observed.** False calm: an easing of the VIX followed by a relapse, in spring 2022 as from 15 to 22 April 2025.",
  "**Plausible.** A panic whose peak stays below 30: the rule does not activate.",
  "**Plausible.** Series published a day late: a VIX that is too old sends the rule to cash.",
]
measured = [
  "**Fact.** By stay: 21 stays, all closed, of 5 valuations on average, 9 winners and 12 losers; mean net -0.02%, median net -0.70%, worst -2.64% (the false start of April 2025), best +3.64% (the second entry of April 2025).",
  "**Fact.** Grouped by convention, two stays separated by 20 valuations or fewer going in the same group, they form 7 groups: three losers (December 2021 to February 2022, -2.07% in five stays; May to July 2022, -2.50% in five stays; October-November 2022, -2.22% in two stays) and four winners (March-April 2022, +0.30% in three stays; August-September 2024, +1.75% in two; April-May 2025, +0.90% in two, false start included; April 2026, +3.30% in two). This grouping is automatic: they are not seven independent panics identified economically.",
  "**Fact.** Signed close-to-open price gap, at given quantities: -4,944 EUR net, i.e. -4.9% of the initial capital, more than twice its explicit costs in absolute value (2,041 EUR). It is neither a cost paid nor the result of a backtest executed at the close.",
  "**Reading.** Seven groups allow no statistical conclusion. Each counts several entries, the winners as the losers: the re-entries are not specific to the losing groups.",
]
to_test = [
  "The rule as a pocket of a portfolio, rather than alone against cash.",
]

[SA10]
summary = "SA10 without factors or money market: five rules (momentum, smoothed averages, dip, relative tilt, easing of the VIX) with fixed budgets and a common risk control. This partial version strongly reduces risk and return through its limited exposure; during April 2025 the exposure falls further, so the protection does not come only from static cash. The own contribution of the diversification between rules remains to be isolated. +32.1% net, Sharpe 0.86. This run does not allow the full version to be judged."
strengths = [
  "**Fact.** Volatility of 6.0% and maximum drawdown of -11.76%, lower than those of all the strategies of this study broadly exposed to equities; beta of 0.41.",
  "**Fact.** Sharpe of 0.86 for an average close weight of 42.4%. With cash that earns nothing and a zero risk-free rate, scaling the returns down roughly preserves the Sharpe: this figure does not prove that the diversification between rules smooths their errors.",
  "**Fact.** 1,986 EUR of costs; 42 positive months and 25 negative out of 67; fourth in the common ranking (51.1%).",
]
weaknesses = [
  "**Fact.** 57.6% of cash on average, and never more than 55.9% invested. The budget of the style funds (30% of the capital) is not allocated for lack of instruments; the rest of the cash comes from the inactive rules, the caps and the risk control. The money-market pocket, also absent, would have placed the residual capital.",
  "**Fact.** +32.1% against +94.8%; alpha of -0.12% a year, close to zero, without an interval.",
  "**Fact.** The fall is shallow but long: peak of 2025-02-19 back on 2026-05-07, 442 days later, against 229 for the fund.",
  "**Fact.** 465 orders: Sharpe of 0.80 and score of 44% in the second run at doubled costs.",
]
worst = "**Fact.** From 2025-02-19 to 2025-04-09 the ensemble loses -11.76% against -21.64% for the fund. The total close weight is about 50% at the start, 49.2% on 2 April, 35.1% on 9 April, then 28.0% on 22 April and 16.0% on 19 May. **Reading.** The starting cash explains part of the protection, the reduction along the way another; their respective shares, and that of the common risk control, are not separated here. **Fact.** The exposure keeps falling after the fund's trough and the year 2025 ends at -1.7% against +6.6%."
best = "**Fact.** The largest rise from a trough to a later peak covers almost the whole period (2021-05-19 to 2026-10-06, +33.9%). Over the 63 best consecutive returns (2026-03-31 to 2026-07-01), the ensemble makes +8.6% against +16.3% for the fund, with a close weight between 49% and 56%. **Reading.** It catches about half of the move because it holds about half of it."
risks = [
  "**Observed.** Fast fall from highs (2025): the exposure is at its usual level at the start and falls mostly after the fall has begun.",
  "**Observed.** Long rising market: the cash, which earns nothing here, is a permanent opportunity cost.",
  "**Observed.** Recovery after a panic: the exposure is at its lowest (16% on 2025-05-19) during the rebound.",
]
measured = [
  "**Fact.** Beside a constant-target control at 15.3% of the S&P 500 fund and 27.1% of the world fund (its average weights), with the same 3-point band and the same costs: the control makes +37.1% net, Sharpe 0.93, maximum drawdown -10.0%, peak back in 231 days, 61 EUR of costs, for an average realised exposure of 44.8%; SA10 makes +32.1%, Sharpe 0.86, -11.8%, 442 days, for 42.4%.",
  "**Reading.** Over this period the ensemble does worse than this control, including in maximum drawdown. The comparison describes two executable rules and does not isolate, at exactly the same exposure, the value of the timing: the control carried 2.4 points more exposure on average, and the composition, the costs and the path differ too. This run does not show that the protection of the ensemble comes from anything other than its level of exposure.",
  "**Fact.** Without its risk control, the ensemble makes +32.6%, Sharpe 0.85, maximum drawdown -11.9%: the measured aggregate effect of this control is small on this run. It does not say how many times the reduction factor was below 1, nor on which dates: neither this factor nor the decisions forced by the risk of the portfolio held are exported.",
  "**Fact.** Removing one rule at a time (its budget staying in cash): without momentum +18.9% (exposure 25%, Sharpe 0.88); without smoothed averages +20.4% (28%, 0.83); without relative tilt +23.9% (33%, 0.82); without dip +31.5% (0.85); without easing of the VIX +32.6% (0.87). The Sharpe stays between 0.82 and 0.88 in every case.",
  "**Reading.** No rule carries the Sharpe of the ensemble: removing one mostly reduces the exposure and the return in the same proportion. The dip and VIX-easing pockets contribute almost nothing.",
]
to_test = [
  "The breakdown of the targets rule by rule at each decision, which the code can compute and which is not exported.",
  "The reduction factor of the risk control, the dates when it is below 1 and the decisions forced by the risk of the portfolio held: as long as they are not exported, neither the frequency of this control nor its role in April 2025 can be commented on.",
  "The full version, with the funds of SA7 and SA8, registered since 2026-10-11: this run is still executed without them.",
  "These ablations are variants looked at after the fact: none is a candidate.",
]

[SA11]
summary = "Hold ETF_WORLD at w = min(1, 12% / max(σ, 5%)), where σ is the annualised volatility that a GARCH(1,1) with Student innovations, re-estimated every evening on 756 returns, forecasts for the next session; the order is sent only if the weight held moves 3 points away from this target. Over this history the GARCH obtains the lowest mean QLIKE, without this lead over the EWMA being demonstrated, and it does not translate into a better net performance: it re-exposes itself more than its controls before the second wave of April 2025 and generates more costs. The configuration does not meet the preregistered criteria; the simple controls are kept. This says nothing about the usefulness of GARCH models in general."
strengths = [
  "**Fact.** Best mean QLIKE observed: -8.6225 against -8.6033 for the EWMA 0.94 and -8.5649 for the estimator of SA6, over 1,415 pairs. The QLIKE is a loss, negative here because the variances are much smaller than one; it is not a return.",
  "**Fact.** This lead is established only against SA6: the paired QLIKE difference is -0.058 against SA6, 95% bootstrap interval [-0.108; -0.017], and -0.019 against the EWMA, interval [-0.051; +0.009], which includes zero.",
  "**Fact.** No fit rejected by the numerical criteria over the 1,416 decisions, hence no EWMA fallback. It demonstrates neither the stability of the parameters nor the validity of the tails: the kurtosis of the standardised residuals stays at 5.7.",
  "**Fact.** Maximum drawdown of -16.50% against -21.64% for the fund, volatility of 11.1% against 13.8%.",
  "**Fact.** Gross, it does slightly better than SA6 (+69.73% against +68.88%); it is after costs that it falls behind (+65.98% against +67.43%). The EWMA control stays ahead, gross as net.",
]
weaknesses = [
  "**Fact.** Net Sharpe of 0.87 against 0.90 for SA6 and 0.93 for the EWMA; deeper maximum drawdown (-16.50% against -15.72% and -15.45%). These are the preregistered refutation criteria.",
  "**Fact.** At the base costs, the intervals of the Sharpe difference include zero: [-0.141; +0.076] against SA6, [-0.147; +0.009] against the EWMA. There is therefore no proof at 95% of a general inferiority. In the second run at doubled costs, the interval against the EWMA is [-0.172; -0.014], negative, under the assumptions of this conditional bootstrap.",
  "**Fact.** 508 orders, turnover of 5.5 times the assets a year, 3,749 EUR of costs, against 180 orders and 1,445 EUR for SA6; the close weight varies by 2.3 points per session on average, against 0.9.",
  "**Fact.** +66.0% against +94.8% for the fund, alpha of -0.4% a year (without an interval); peak back on 2026-01-09, 324 days later, against 229 for the fund.",
  "**Fact.** Seventh in the common ranking (48.7%). The gap with SA6 (52.0%) and the EWMA (53.6%) is not a test of superiority.",
]
worst = "**Fact.** From 2025-02-19 to 2025-04-09 the strategy loses -16.50% against -21.64% for the fund. On 19 February the forecast volatility is 10.9% and the weight 99.9%. The close weight falls to 65.8% on 7 March and 60.7% on the 12th, then rises again: 79.8% on 20 March, 77.7% on 2 April, when SA6 is at 65.0% and the EWMA at 67.2%. It is 37.7% on 7 April, 38.5% on the 8th, 31.6% on the 9th. The trough, for the strategy as for the fund, is on 9 April: that evening the forecast is 42.7% and the target 28.1%, executed the next day (28.9% held on 10 April, 28.7% on the 11th). The forecast of 45.2% on 10 April, the highest of the period, comes after and triggered none of these sales. **Reading.** The rise of the risk in March is local and observed; attributing it to the GARCH's return towards its mean is plausible, but with parameters re-estimated every evening the path depends on the shocks and on their recalibration, and it is not an established general property."
best = "**Fact.** The largest rise from a trough to a later peak runs from 2022-06-17 to 2026-10-06 (+70.2% against +96.6% for the fund, average weight 90%), any length. Over the 63 best consecutive returns (2023-10-30 to 2024-01-30, +15.27% against +15.58%), the close weight is 99% on average and goes down to 88.8%; the forecast exceeds the target of 12% at 13 valuations, up to 13.6%. Four orders are executed in it, for 20 EUR of costs. **Reading.** When the forecast risk stays close to or below the target, GARCH, EWMA and SA6 do roughly the same thing, at a low cost."
risks = [
  "**Observed.** Fall in two stages with a lull in between (March-April 2025): the strategy meets the second wave more exposed than its two controls.",
