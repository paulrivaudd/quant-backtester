[EWMA94control]
summary = "The control of SA11: the same allocation rule, the same window and the same band, on an EWMA variance of coefficient 0.94 whose coefficients are not re-estimated. It gives here the best observed compromise between net performance, cost and reduction of the loss among the three volatility controls: +73.4% net, Sharpe 0.93. This observation does not demonstrate that its lead is significant. It has no catalogue code and was not the object of the hypothesis."
strengths = [
  "**Fact.** Sharpe of 0.934 against 0.930 for the fund held: an economically tiny gap, which demonstrates no superiority. Maximum drawdown of -15.45% instead of -21.64%.",
  "**Fact.** 220 orders, 1,519 EUR of costs, turnover of 2.1 times the assets a year; +70.9% and a Sharpe of 0.91 in the second run at doubled costs.",
  "**Fact.** No daily statistical optimisation: a single parameter, set in advance at 0.94, a variance started on 60 returns, then a recursion. No dependence on a GARCH optimiser, hence no possible non-convergence.",
  "**Fact.** Second in the common ranking (53.6%), ahead of SA6 (52.0%) and SA11 (48.7%); these gaps are not a test.",
]
weaknesses = [
  "**Fact.** Mean QLIKE of -8.6033, worse than the GARCH's (-8.6225) in the sample; the interval of this difference includes zero. It is, on the other hand, better than that of the estimator of SA6, with an interval that excludes zero ([-0.075; -0.006]).",
  "**Fact.** The mean of r²/q is 1.106: the squared returns exceed the forecast variances on a normalised average. This does not mechanically mean an under-forecast of 10.6% (a mean of ratios is not a ratio of means).",
  "**Fact.** +73.4% against +94.8% for the fund; peak back on 2026-01-06, 321 days later, against 229 for the fund.",
  "**Fact.** The alpha of +0.39% a year is a point estimate without an interval. Its lead over SA6 was tested and is not conclusive: the interval of the Sharpe difference includes zero (complementary measures).",
]
worst = "**Fact.** From 2025-02-19 to 2025-04-09 the control loses -15.45% against -21.64% for the fund, with a close weight going from 97% to 34%. On 2 April, before the second wave, it holds 67.2%, against 77.7% for SA11 and 65.0% for SA6. **Reading.** In this episode the EWMA stays less exposed than SA11 before the April shock. It cannot be inferred that its memory is in general longer than a GARCH's: the weight of a shock decays in it by 0.94 per observation, a half-life of about 11 observations, and the response of a re-estimated GARCH depends on several parameters and on the path of the returns."
best = "**Fact.** The largest rise from a trough to a later peak covers almost the whole period (2021-05-19 to 2026-10-06, +78.1% against +100.2%). Over the 63 best consecutive returns (2023-10-30 to 2024-01-30, +15.40% against +15.58%), the close weight does not go below 91.2%; the forecast volatility exceeds 12% at six valuations, up to 13.2%. Three orders, 18 EUR of costs."
risks = [
  "**Observed.** Sudden shock in a calm market: weight close to 100% at the time of the shock.",
  "**Observed.** Fast rebound after a panic: the weight stays between 30% and 44% from 2025-04-15 to 2025-05-19.",
  "**Plausible.** Regime of volatility lastingly above 12% in a rising market.",
]
measured = [
  "**Fact.** Beside a constant-target control at 87.8% of the fund (its average weight), with the same 3-point band and the same costs: this control makes +81.6% net, Sharpe 0.92, maximum drawdown -19.5%, peak back in 229 days, for an average realised exposure of 89.3%; the EWMA makes +73.4%, Sharpe 0.93, -15.4%, 321 days, for 87.8%.",
  "**Reading.** It is the only one of the three volatility controls whose Sharpe equals that of its constant-target control (0.93 against 0.92), with four points less maximum drawdown and eight points less return. The comparison describes two executable rules and does not isolate, at exactly the same exposure, the value of the timing: the control carried 1.5 points more exposure on average.",
  "**Fact.** Against SA6: Sharpe difference of +0.036 in its favour, 95% bootstrap interval [-0.027; +0.104], which includes zero.",
  "**Fact.** At the coefficients 0.90 and 0.97, set before their run: Sharpe of 0.90 (366 orders, 2,686 EUR of costs, maximum drawdown -14.6%) and of 0.97 (127 orders, 769 EUR, -17.1%).",
  "**Fact.** Signed close-to-open price gap, at given quantities: -3,076 EUR net. It is neither a cost paid nor the result of a backtest executed at the close.",
]
to_test = [
  "The coefficient 0.97 does better here; retaining it for that would be choosing a parameter on the history that designated it.",
  "Looked at after the fact as a control, the EWMA was not preregistered as a candidate: retaining it would be a new hypothesis to write.",
]

[SA14]
summary = "A small neural network, trained on 2019-2023 and selected on 2024, proposes every evening weights between ETF_WORLD, ETF_SP500_PEA and cash. It reduces the overall risk through its share of cash, but also produces large changes of allocation: in early April 2025 it cuts sharply during the fall then rises again fast, and the portfolio reaches its trough after the fund's. Over its test dates (2025-01-02 to 2026-10-09) it shows no net advantage: +13.4% against +24.5% for the fund held."
strengths = [
  "**Fact.** Volatility of 9.9% against 14.3% for the fund, maximum drawdown of -16.11% against -21.51%.",
  "**Fact.** 270 orders for 756 EUR of costs.",
  "**Fact.** Maximum drawdown recovered on 2025-10-28, 251 days after the peak.",
]
weaknesses = [
  "**Fact.** Sharpe of 0.76 against 0.93, alpha of -1.4% a year (without an interval) for a beta of 0.67, on these dates only.",
  "**Fact.** Score of 45.8%, below the 50% threshold of its hypothesis, and a Sharpe below the fund's: both refutation criteria are met. This score is deflated for a single trial and is not comparable with those of the other strategies.",
  "**Fact.** The original test, closed at 2026-09-30, was read on 2026-10-04; this run extends it by seven sessions with the same model. The extension does not reset the counter.",
  "**Fact.** The sensitivities foreseen by the hypothesis - seeds 43 and 44, doubled costs with the frozen model then with a recalibrated model - are in the complementary measures below. The robustness block of the score uses an approximate stress, not a second run.",
  "**Reading.** The network does timing; the open question is whether this timing adds or removes value compared with a constant allocation. A bad timing is not an absence of timing.",
]
worst = "**Fact.** From 2025-02-19 to 2025-04-22 the strategy loses -16.11%. Apart from the first session, still in cash, its total close weight ranges from 47.4% to 87.3% over the whole period, with a standard deviation of about 8 points: it is not a constant-weight portfolio. In early April it goes from 75.6% on the 2nd to 47.4% on the 9th, i.e. -28 points during the fall, then rises again to 78.7% on the 16th. On 9 April, the fund's trough, the portfolio is worth 85,414 EUR; on 22 April it is worth 85,340 EUR, i.e. -0.09%, while the close of the world fund gains +3.80% between these two dates. **Reading.** The late trough is explained by this chronology of reallocations, and by the share of the S&P 500 fund, rather than by the average level of exposure. The fills would allow what comes from the weights, the night and the fees to be separated."
best = "**Fact.** The largest rise from a trough to a later peak runs from 2025-04-22 to 2026-10-06 (+32.9% against +47.7% for the fund, average weight 68%). Over the 63 best consecutive returns (2025-04-22 to 2025-07-21) the strategy makes +13.0% against +15.3%, with a close weight between 67% and 87%. **Reading.** The network is then more invested than on average; what this owes to its choice rather than to the general rise is not isolated."
risks = [
  "**Observed.** Long rising market: a third of the capital in cash that earns nothing is an opportunity cost.",
  "**Observed.** Fast fall followed by a rebound (April 2025): reduction during the fall, return to risk before the second trough of the portfolio.",
  "**Plausible.** Regime absent from its training (2019-2023): the softmax output and the caps always bound the weights, but nothing ensures their economic relevance if the inputs drift; the artifact is not retrained.",
]
measured = [
  "**Fact.** Beside a constant-target control at 36.3% of the S&P 500 fund and 30.3% of the world fund (its average weights), over the same dates, with the same 3-point band and the same costs: the control makes +17.2% net, Sharpe 0.93, maximum drawdown -15.2%, peak back in 225 days, 76 EUR of costs, for an average realised exposure of 68.3%; SA14 makes +13.4%, Sharpe 0.76, -16.1%, 251 days, for 66.6%.",
  "**Reading.** Over these dates SA14 does worse than this control built on its own average weights. The comparison describes two executable rules and does not isolate, at exactly the same exposure, the value of the network's timing: the control carried 1.7 points more exposure on average, and the composition, the costs and the path change too. The control is chosen after the fact.",
  "**Fact.** The share of the S&P 500 fund in what is invested ranges from 33% to 66% (average 55%): the network also moves the split between the two funds.",
  "**Fact.** Announced sensitivities, over the original period (up to 2026-09-30): seed 42, score 44.5% and Sharpe 0.68; seed 43, 45.9% and 0.70; seed 44, 45.6% and 0.71. The Sharpe of the fund held there is 0.86.",
  "**Fact.** At doubled costs, over the same original period, two runs answer two questions. The frozen model of the test (`d9bfd125bf69`, same normalisation, same weights, epoch 20), replayed doubling only the costs of the engine: score 40.7%, +11.0% net, Sharpe 0.64, maximum drawdown -16.2%, 1,434 EUR of costs instead of 752. The calibration redone under these costs retains epoch 15 instead of 20 (`a5afb76183eb`): it is another model, score 44.3%, +11.8% net, Sharpe 0.69, 1,037 EUR of costs. In each variant the Sharpe stays below the fund held's and the score below 50%.",
  "**Fact.** The 319 features read by the network at each of the 453 decisions are exported (`sa14_inputs.csv`); every decision has a complete vector.",
]
to_test = [
  "The inputs are exported but not analysed: nothing here says which features explain the reallocations of April 2025.",
  "Three seeds that fail in the same way do not make an independent test: same data, same period, already looked at.",
]

