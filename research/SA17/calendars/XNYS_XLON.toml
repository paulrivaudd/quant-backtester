# NYSE sessions on which the London Stock Exchange is also open. Data, not a rule: holidays are listed, never derived.
#
# Generated by scripts/generate_calendars.py from exchange_calendars 4.13.2,
# and checked session by session against it. Do not edit by hand: change the
# script and regenerate, so the change shows up as a reviewed diff.
calendar_id = "XNYS_XLON"
# Each session is a XNYS session, at its hours (checked).
subset_of = "XNYS"
timezone = "America/New_York"
regular_open = "09:30:00"
regular_close = "16:00:00"

# The lists below are complete for this period only. Any date outside it raises
# CalendarCoverageError rather than being assumed a regular weekday.
# From 2015, before the first SA17 fund NAV (July 2015). The observation grid
# of NAVs struck on UK business days and read beside US closes: a UK holiday
# is a weekday without a session here although New York trades.
covered_from = 2015-01-01
covered_until = 2027-12-31

