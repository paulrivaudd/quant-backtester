# London Stock Exchange trading calendar. Data, not a rule: holidays are listed, never derived.
#
# Generated by scripts/generate_calendars.py from exchange_calendars 4.13.2,
# and checked session by session against it. Do not edit by hand: change the
# script and regenerate, so the change shows up as a reviewed diff.
calendar_id = "XLON"
timezone = "Europe/London"
regular_open = "08:00:00"
regular_close = "16:30:00"

# The lists below are complete for this period only. Any date outside it raises
# CalendarCoverageError rather than being assumed a regular weekday.
# From 2015, before the first SA17 fund NAV (July 2015). SA17's NAV release
# rule counts its one-business-day lag on it (research/SA17/protocol.md,
# executable run); it is not a venue any book trades on.
covered_from = 2015-01-01
covered_until = 2027-12-31

