# SA17 acquisition registry, declared 2026-11-02 before ingestion; the market
# factor at the end was added on 2026-11-07, before the first download.
# This is a sourcing pool, NOT the strategy's frozen historical universe.
# EUR exchange quotations of accumulating UCITS funds; no synthetic USD or
# total-return-index series is manufactured from them. Real estate is missing.
# EUR listing dates below are from the issuer's dated listing tables, not the
# earlier fund inception dates. See sourcing_20261102.md for evidence/limits.
# All use the project's existing Yahoo adapter and normalizer, including its
# refusal of split-adjusted histories and normal corporate-action checks.
#
# runs/sa17_store concatenates the project registry, the two SA15 additions and
# this file (scripts/SA17_download_data.py). The monetary fund, ECB EUR/USD and
# the funds of the external references are fetched under their existing
# declarations and identifiers, not redeclared here.

