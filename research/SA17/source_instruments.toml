# The market factor of the proposal: S&P 500 total returns in USD. The project
# SP500 (^GSPC) is a price index and does not qualify. Yahoo serves the S&P Dow
# Jones Indices total-return index under ^SP500TR; by its name it is the gross
# series (dividends reinvested before withholding tax), checked on the data
# only (sourcing note, 2026-11-07), not against S&P's own published levels.
# An index cannot split or pay, so the Yahoo adapter's split check does not
# apply. Signal only, never held. Its close is the 16:00 New York close.
[[instrument]]
id = "SP500TR"
name = "S&P 500 total return index (USD)"
asset_type = "INDEX"
data_type = "BAR"
currency = "USD"
primary_source = "YAHOO"
source_symbol = "^SP500TR"
calendar_id = "XNYS"
tradable = false
first_session = 1990-01-02
history_basis = "ASSUMED_UNREVISED"
history_note = "An index close is a final print. Levels as served by Yahoo at retrieval; no earlier fetch to compare with and not checked against S&P Dow Jones Indices. Total return in USD, dividends reinvested; gross by its name, unverified against the issuer. Signal only: the SA17 market factor candidate, not admitted until the protocol is frozen."
