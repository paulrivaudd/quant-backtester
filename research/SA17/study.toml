strategy_id = "SA17_sector_residual_momentum"

[books]
candidate = "SA17_sector_residual_momentum"
# SA17SectorResidualMomentum.controls(), each a run of its own.
controls = [
    "total_momentum",
    "no_volatility_target",
    "equal_sectors",
    "equal_sectors_volatility_target",
]
# Fixed before SA17: SA16_it2 rebuilt from results/SA16/selected.json (its
# fingerprint checked), weekly as archived; Nasdaq bought and held.
references = ["SA16_it2", "Nasdaq_buy_hold"]
descriptive = ["SA16_it2_C1_constant_two_thirds"]

[costs]
# Sector funds: research/SA17/costs.toml, unchanged. Every other fund any
# book trades gets the same terms, with the floor of costs.toml's half-spread
# formula: no observed quote was recorded for them (an assumption).
