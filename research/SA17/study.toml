sessions_per_year = 252
risk_free_rate = 0.0
minimum_sessions = 60

[inference]
method = "paired_stationary_bootstrap"
primary_statistic = "SHARPE"
secondary_statistic = "MEAN_RETURN"
mean_block_sessions = 20
sensitivity_blocks = [5, 60]
draws = 10000
seed = 20261107
level = 0.95
holm_families = { references = ["SA16_it2", "Nasdaq_buy_hold"], controls = [
    "total_momentum", "no_volatility_target", "equal_sectors", "equal_sectors_volatility_target",
] }
significance = 0.05
deflated_sharpe_trials = 5
max_drawdown_tolerance = 0.02

