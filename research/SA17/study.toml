# SA17 executable study: every parameter of the run, frozen before it.
#
# Written 2026-11-08, before any SA17 score, weight or portfolio return was
# computed on the executable data. Only coverage dates, calendars and the
# admission evidence had been read. research/SA17/protocol.md, "Executable run:
# frozen schedule and assumptions", explains each entry. scripts/SA17_run_study.py
# reads this file and nothing else for its parameters; a change after the first
# run is a new hypothesis, not a correction.

