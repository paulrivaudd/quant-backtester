[nav_publication]
# Prospectus, p.55: NAV(D) made public on the business day following D.
# Declared assumption (owner, 2026-11-07): usable from 23:00 Paris on the next
# UK business day. No retrieval floor in this store.
publication_time = 23:00:00
timezone = "Europe/Paris"
lag_sessions = 1
calendar_id = "XLON"

[fx]
id = "SA17_FX_EURUSD_US_CLOSE"
quote = "USD_PER_EUR"
source = "Dukascopy hourly bid/ask closes, mid, at each XNYS session close"
