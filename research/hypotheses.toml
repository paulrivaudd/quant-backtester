# Hypotheses, written before the experiments that test them - committed, like
# every decision a result is reproduced from. See research/PROTOCOL.md and
# quant_backtester.research.hypotheses.
#
# The seven below name the runs made before this file existed: they are
# EXPLORATORY, declared on the day this file was written, after their runs.
# They describe what was looked at; they test nothing. A new idea is written
# here as PREREGISTERED before its first variant is run.

[[hypothesis]]
hypothesis_id = "reference_rotation"
status = "EXPLORATORY"
written_on = 2026-09-26
statement = "Holding the better of two PEA funds on 60-session momentum beats holding the world fund."
universe = "ROTATION_2"
prediction = "Higher net return than buy and hold of ETF_WORLD over the same sessions."
refutation = "Lower net return than buy and hold of ETF_WORLD over the same sessions, net of costs."

[[hypothesis]]
hypothesis_id = "buy_and_hold_both"
status = "EXPLORATORY"
written_on = 2026-09-26
statement = "Buying both funds once is the passive yardstick of ROTATION_2."
universe = "ROTATION_2"
prediction = "One session of trading, costs of one purchase per fund."
refutation = "Trades after the initial purchase."

