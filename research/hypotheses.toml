# Hypotheses, written before the experiments that test them - committed, like
# every decision a result is reproduced from. See research/PROTOCOL.md.
#
# One per catalogued strategy that was studied on its own, written before its
# first run: what it predicts, on which universe, and what would refute it.
# `ml1_neural_allocation` is the hypothesis of SA14, under the code that
# strategy had when it was written. The statuses a study gives its hypothesis
# are in results/<CODE>/study.md.
#
# The hypotheses of the baselines and of the exercises removed from the code on
# 2026-10-11 were removed with them; they are in the history of this file.

[[hypothesis]]
hypothesis_id = "ml1_neural_allocation"
status = "PREREGISTERED"
written_on = 2026-10-04
statement = "A small network reading 100 sessions of ETF_WORLD, ETF_SP500_PEA and the VIX, trained on 2019-2023 and selected on 2024, allocates between the two funds and cash better than holding the world fund."
universe = "ETF_WORLD and ETF_SP500_PEA, final test from 2025-01-02 to 2026-09-30, run once on the artifact of seed 42 at x1 costs. Written after the calibration and its 2024 validation were seen (selected epoch 20, about a third in each fund and a third in cash) and before any test run. The test sessions are not untouched: both funds' history to 2026-09 was looked at in earlier exercises."
prediction = "On the test, a net Sharpe ratio above that of ETF_WORLD bought and held with the same costs, and a quality score (QUALITY_V1, one trial) of at least 50%."
refutation = "A net Sharpe ratio at or below buy and hold's, or a quality score under 50%. Seeds 43 and 44 and x2 costs are reported beside it and never replace seed 42."

[[hypothesis]]
hypothesis_id = "sa11_garch_vol_control"
status = "PREREGISTERED"
written_on = 2026-10-10
statement = "Scaling the exposure to ETF_WORLD by the one-step volatility forecast of a GARCH(1,1) with Student innovations, re-estimated at every decision on the 756 daily log returns known then, improves the risk-adjusted performance of the two simple volatility controls: SA6 (the larger of two realised volatilities) and the same rule on an EWMA of decay 0.94."
universe = "ETF_WORLD and cash, on the common period that starts at the first XPAR session holding 757 consecutive closes of ETF_WORLD (2021-04-01) and ends on 2026-10-09, 100 000 EUR, costs of the ETF comparison. Parameters fixed before any run and not fitted: target 12%, floor 5%, band 0.03, annualisation 252, one starting point (0.05 s2, 0.05, 0.90, 8), EWMA fallback 0.94 seeded on 60 returns. Written after the store was extended to 2026-10-09 and before any GARCH forecast was computed on it. A retrospective evaluation with chronological forecasts: the history of ETF_WORLD was looked at in every earlier exercise, so the period is not an untouched sample."
prediction = "A net Sharpe ratio above SA6's and above the EWMA control's on the common period, with a maximum drawdown no deeper than either, and the same ordering when every cost is paid twice in a second real run."
refutation = "A net Sharpe ratio at or below SA6's or the EWMA control's, a deeper maximum drawdown than either, or an ordering that does not survive doubled costs. A paired block bootstrap of the Sharpe difference (blocks of 20 sessions, 5 000 draws, seed 20261010, 95%) whose interval includes zero is an uncertain result, not a confirmation: the simple rule is then kept. A lower QLIKE of the forecast alone does not rescue the strategy."

[[hypothesis]]
hypothesis_id = "sa12_arima_garch"
status = "PREREGISTERED"
written_on = 2026-10-10
statement = "Holding ETF_WORLD only while an ARIMA(1,0,1) fitted on its 756 adjusted open-to-open log returns forecasts a positive return for the first session an order can be held over - the second step ahead - improves the net risk-adjusted result of the same risk sizing without that direction filter. The risk is the two-step variance of the return, v2 = h2 + (phi + theta)^2 h1, from a GARCH(1,1) with Student innovations fitted on the 696 ARIMA innovations left after dropping the first 60."
universe = "ETF_WORLD and cash, 2021-04-01 (first XPAR session holding 757 aligned opens and closes) to 2026-10-09, 100 000 EUR, costs of the ETF comparison. Frozen before any run: entry above 20 bp of forecast log return, hold while strictly positive, exit at zero; target 12%, floor 5%, band 0.03; ARIMA by state space, stationary initialisation, L-BFGS from (window mean, 0, 0, window variance); GARCH conventions of SA11; EWMA 0.94 fallback on the same residuals. Controls, without catalogue codes: D0 same forecast and risk with the filter always on; D1 the same ARIMA with an EWMA variance; D2 a constant mean with GARCH. Written after SA11, its controls and every other book of this period were seen, and before any ARIMA was fitted on the store: a retrospective evaluation with chronological forecasts, not an untouched sample. A sequential two-stage estimation, not a joint ARIMA-GARCH likelihood."
prediction = "A net Sharpe ratio of SA12 above D0's, with a paired block bootstrap interval of the difference (blocks of 20 sessions, 5 000 draws, seed 20261010, 95%) whose lower bound is above zero, a difference still positive in a second real run with every cost doubled and the entry threshold unchanged, and a maximum drawdown no deeper than D0's."
refutation = "Statuses, in this order. INSUFFICIENT_EVIDENCE: fewer than 252 evaluable forecast pairs, fewer than 30 completed position episodes, under 95% of usable joint forecasts on admissible windows, or more than 5% of EWMA fallbacks among the volatility fits attempted. NOT_SUPPORTED: a Sharpe difference at or below zero, at base or at doubled costs. UNCERTAIN: a positive difference whose interval includes zero, or a deeper drawdown than D0. SUPPORTED_RETROSPECTIVE otherwise. Whether GARCH adds anything is concluded apart, against D1: a result against D0 does not justify GARCH if ARIMA-EWMA does as well. NOT_SUPPORTED does not say ARIMA-GARCH never works; SUPPORTED_RETROSPECTIVE does not say it is ready to trade."

[[hypothesis]]
hypothesis_id = "sa13_signatures_neurons"
status = "PREREGISTERED"
written_on = 2026-10-10
statement = "A neural additive model reading the 13 coefficients of the order-3 log-signature of the last 60 sessions of ETF_WORLD - cumulative log return, cumulative relative turnover, session time, the constant displacement of time removed - forecasts the simple return from the next open to the one after it well enough for a direction filter built on it to improve the net risk-adjusted result of the same SA6 risk sizing without that filter."
universe = "ETF_WORLD and cash; models re-estimated at each month end on 1 008 candidate origins and selected on the 126 that follow, purged at both boundaries, frozen for the month. The first month tested is the first one whose calibration holds 900 valid training examples, 100 validation ones and 95% of valid features in each purged block: from the calendar and the 120 sessions of history a path needs, January 2023 (cutoff 2022-12-30), so the study runs from 2023-01-02 to 2026-10-09 with one continuous book. Frozen before any run: path, Hall basis of esig with roughpy, 4 tanh units per coefficient centred at zero, AdamW 1e-3 / 1e-3, at most 300 epochs, patience 30, seed 20261010; entry above 20 bp, hold while strictly positive, exit at zero; SA6 sizing, band 0.03. Controls, without catalogue codes: C0 same models and sizing with the filter always on; Ridge on the same 13 coefficients; NAM on order 2; NAM without the volume channel; NAM on nine classical indicators; Ridge on the raw 120-value trajectory; NAM and Ridge on World plus S&P 500 PEA (26 coefficients). XGBoost is not developed. Written after every book of this period was seen and before any signature model was fitted: retrospective."
prediction = "Economic, main: a net Sharpe ratio of SA13 above C0's, with a paired block bootstrap interval (blocks of 60 sessions, 5 000 draws, seed 20261010, 95%; 20 and 120 reported as announced sensitivities) whose lower bound is above zero, still positive at doubled costs with the same models, and a drawdown no deeper than C0's. Representation: a lower out-of-sample MSE than the NAM on classical indicators. Model: a lower MSE than Ridge on the same log-signatures. Secondary: order 3 below order 2, and with volume below without."
refutation = "Sufficiency first: fewer than 504 test sessions, fewer than 30 completed position episodes, or under 95% of decisions with an authorised model and usable features make the study insufficient. Then, on the economic question: not supported when the Sharpe difference is at or below zero, uncertain when it is positive with an interval that includes zero, supported retrospectively when its lower bound is above zero, it stays positive at doubled costs and the drawdown is no deeper than C0's. The contribution of signatures and that of the neurons are concluded apart, against the classical indicators, the raw trajectory and Ridge: a favourable economic score does not show either was needed. No control replaces the SA13 result after the test is read."

