universe = "ETF_WORLD from 2019-04-01 to 2026-09-17 (first run, no parameter fitted), then the S&P 500 index held on paper in USD from 1991-01-02 to 2018-12-31. Parameters fixed before any run: trend 200 sessions, correlation 60 pairs, VIX z-score over 60 observations above 1.5."
