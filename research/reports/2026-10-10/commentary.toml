# Commentaire rédigé de chaque stratégie, lu par scripts/write_strategy_reports.py.
#
# Version 2, du 2026-10-10, réécrite après la revue indépendante
# `revue_analyses_strategies_resultats_10102026.md` (faite sur le commit
# 4e04eae). Ce qui a changé : les chronologies sont données en dates, signaux
# et poids tels que les historiques les publient ; chaque point dit s'il est
# un fait mesuré, une lecture ou une question ouverte ; les conclusions
# causales non démontrées ont été retirées ou renvoyées à « ce qui reste à
# mesurer » ; la récupération des baisses et le contrôle 50/50 sont cités.
#
# Conventions de lecture, valables partout ci-dessous :
# - « Fait » : relu dans les exports de results/garch_study (summary.csv,
#   history_*.csv, fills.csv, comparison.csv, forecast_*.csv), run du commit
#   788507b sur le magasin 750c23dfffc3, période 2021-04-01 -> 2026-10-09.
# - « Lecture » : une interprétation plausible de ces faits, non démontrée.
# - Une décision est prise le soir de t (signal et poids cible de la ligne t)
#   et exécutée à l'ouverture de t + 1 : elle n'apparaît dans le poids détenu
#   qu'à la ligne t + 1. Le « poids détenu » est celui de la valorisation du
#   soir. Une variation de clôture du fonds entre deux dates est un mouvement
#   du sous-jacent, pas une perte ni un manque à gagner comptable.
# - Repères : ETF_WORLD détenu fait +94,8 % net (Sharpe 0,93), perd -21,64 % du
#   2025-02-19 au 2025-04-09 et retrouve ce sommet le 2025-10-06, 229 jours
#   plus tard. Le panier 50/50 rebalancé des deux fonds fait +103,3 % net.
# - Rien de ceci n'est un échantillon vierge : l'historique a déjà été regardé.

