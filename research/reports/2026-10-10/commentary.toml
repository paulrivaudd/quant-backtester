# Commentaire rédigé de chaque stratégie, lu par scripts/write_strategy_reports.py.
#
# Écrit le 2026-10-10 d'après les exports de results/garch_study (commit ee7ff0c,
# magasin 750c23dfffc3, période commune 2021-04-01 -> 2026-10-09) et, pour ML1,
# d'après son run de test 2025-01-02 -> 2026-10-09. Les chiffres cités viennent
# de ces exports ; l'interprétation est une lecture, pas une mesure. Une
# évaluation rétrospective : aucune de ces périodes n'est un échantillon vierge.
#
# Repères communs : ETF_WORLD détenu fait +94,8 % net (Sharpe 0,93, volatilité
# 13,8 %), avec une perte maximale de -21,6 % en 36 séances, du 2025-02-19 au
# 2025-04-09, et une année 2022 à -13,7 %.

