[ML1]
summary = "Un petit réseau de neurones, entraîné sur 2019-2023 et sélectionné sur 2024, propose chaque soir des poids entre ETF_WORLD, ETF_SP500_PEA et le cash. Il réduit le risque global par sa part de cash, mais produit aussi des changements d'allocation importants : début avril 2025 il coupe fortement pendant la baisse puis remonte vite, et le portefeuille atteint son creux après celui du fonds. Sur ses dates de test (2025-01-02 au 2026-10-09) il ne montre pas d'avantage net : +13,4 % contre +24,5 % pour le fonds détenu."
