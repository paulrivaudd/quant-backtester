# Xetra trading calendar. Data, not a rule: holidays are listed, never derived.
#
# Generated by scripts/generate_calendars.py from exchange_calendars 4.13.2,
# and checked session by session against it. Do not edit by hand: change the
# script and regenerate, so the change shows up as a reviewed diff.
calendar_id = "XETR"
timezone = "Europe/Berlin"
regular_open = "09:00:00"
regular_close = "17:30:00"

# The lists below are complete for this period only. Any date outside it raises
# CalendarCoverageError rather than being assumed a regular weekday.
# From 2014. Over 2014-2026 the four Xetra funds of the registry have a bar
# on every session listed here but two, and none on any other day. Before
# 2014 the library schedules German Unity Day (3 October 2011, 2012, 2013)
# as a session and the provider serves no bar on it: extend only after
# checking those days against an independent source.
covered_from = 2014-01-01
covered_until = 2027-12-31

