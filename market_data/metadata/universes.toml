# Universes: which instruments a strategy may choose from, and when.
#
# Membership is dated because a list of names is a list of the survivors. A
# name that left stays in this file with the date it left on: removing it would
# put survivorship back into every backtest run over the period it was there.
#
# from_date and until_date are inclusive session dates, and both are optional:
# an absent from_date means "since the instrument was listed", an absent
# until_date means "still a member". Every window is checked against the
# instrument's own listing window when this file is read.

# A trading universe holds what a book may actually hold. Every member of one
# is checked against the registry when a run reads it: an instrument declared
# tradable = false, or quoted in another currency than the book, is refused
# rather than ranked, chosen and then quietly never bought. An index, a yield
# or a volatility gauge reaches a decision through a signal of its own instead.

[[universe]]
id = "ROTATION_2"
name = "Two PEA funds: world and S&P 500"

# Both are PEA-eligible, both are quoted in euros on Euronext Paris, and both
# can be bought at the open the decision is filled at. The rotation in the
# README chooses between exactly these two. It used to hold the S&P 500 index
# itself, which has an opening print and no way to buy it: the orders were
# never sent, and the run described a strategy nobody could have followed.
[[universe.member]]
instrument_id = "ETF_WORLD"

# The fund listed before the ETF above, but membership starts when the universe
# does: the rotation is only a rotation once both funds have a market.
[[universe.member]]
instrument_id = "ETF_SP500_PEA"
from_date = 2018-04-18

[[universe]]
id = "MACRO_3"
name = "The published series"

# Not tradable, and not meant to be: a strategy reads these to decide what to
# do with the funds above. They are a universe of their own because the signal
# engine asks every signal about one universe, and a yield is not a fund.
[[universe.member]]
instrument_id = "US10Y"

[[universe.member]]
instrument_id = "VIX"

[[universe.member]]
instrument_id = "ECB_EURUSD"
