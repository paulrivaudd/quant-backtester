# Sessions reviewed as missing from a series - committed configuration, like
# every other decision a result is reproduced from.
#
# A gap is never filled: no last price carried over, no interpolation, no bar
# from another venue. The reader serves it as MISSING. What this file changes
# is that coverage tells a reviewed gap from one nobody has looked at, and that
# a provider starting to serve a bar for a NO_BAR_SERVED gap stops the
# ingestion until the gap is reviewed again. A BAR_DROPPED gap is the trace of
# an entry in bar_corrections.toml and must have one.
#
# No committed run reads these sessions: every run starts on or after
# 2018-07-16, its warm-up reaching back to April 2018 at most. ESE before
# 2018-04-18 is not a research history in any case - it traded a few thousand
# shares, some 25 000 EUR, a day.

[[gap]]
instrument_id = "ETF_SP500_PEA"
session_date = 2014-12-24
kind = "NO_BAR_SERVED"
hypothesis = "no trade on a half day: Euronext closed at 14:05 and New York early"
evidence = """Yahoo serves 2014-12-23 (1 356 shares) and 2014-12-29 (1 440); the \
fund traded a median 3 372 shares a day in 2014-2015. No second source reaches \
2014 (Euronext serves about two years). Reviewed 2026-09-26."""
reviewed_on = 2026-09-26

