# Reviewed decisions about sessions two sources disagree on - committed
# configuration, like every decision a result is reproduced from. See
# quant_backtester.data.conflict_reviews.
#
# A review records every source's bar exactly as it was reviewed, and applies
# only while each source still serves those values: a provider that changes
# its bar sends the session back to CONFLICT until it is reviewed again. The
# session is served from the chosen source's whole bar and marked REVIEWED,
# never CONFIRMED.
#
# The choice below is the same for all thirteen: EURONEXT, the venue the two
# funds are listed on. Its official prices are published the evening of the
# session, so serving them is serving what a decision taken that evening could
# know. Reviewed 2026-09-26.

