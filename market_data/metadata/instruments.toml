# Instrument registry - committed configuration.
#
# A backtest result follows from committed code plus this file. Editing it
# changes past results, so changes belong in a reviewed diff.

[[instrument]]
id = "SP500"
name = "S&P 500"
asset_type = "INDEX"
data_type = "BAR"
currency = "USD"
primary_source = "YAHOO"
source_symbol = "^GSPC"
calendar_id = "XNYS"
tradable = false
first_session = 1990-01-02

# The second PEA-eligible fund, and the reason the rotation is a rotation: both
# of these can actually be bought inside a French PEA, in euros, on the same
# venue. The S&P 500 index below cannot be bought at all, which is why it is
# declared tradable = false and never belongs to a trading universe.
#
# Yahoo serves 129 flat sessions before 18 March 2014, volume zero and an open
# equal to its close: published net asset values from before the share class
# had a market, exactly as for CW8. The first session with a real bar is
# 2014-03-18, and the series is declared from it.
#
# Yahoo's only inconsistent bar in thirteen years - open 9.22583 above high
# 9.20667 on 2017-09-07 - used to keep those four years out of the store: the
# validator refuses the whole series for it, as it should. That session is now
# dropped by a reviewed correction in bar_corrections.toml, with the reason on
# file, and the rest of the history is ingested. The session itself is a hole,
# not a repaired price: nothing knows the high the market really made.
[[instrument]]
id = "ETF_SP500_PEA"
name = "BNP Paribas Easy S&P 500 (PEA)"
asset_type = "ETF"
data_type = "BAR"
currency = "EUR"
primary_source = "YAHOO"
source_symbol = "ESE.PA"
calendar_id = "XPAR"
tradable = true
# Whole shares: a retail order book takes 123 of them or 124, never 123.47.
quantity_step = 1.0
first_session = 2014-03-18
# Capitalising (C) share class, like CW8: an empty dividend feed is expected.
distribution_policy = "ACCUMULATING"

  # Yahoo reports no split for ESE, so its bars are raw (checked 2026-09-20).
  # Euronext serves about two years only: older sessions stay SINGLE_SOURCE.
  [[instrument.check_sources]]
  source = "EURONEXT"
  source_symbol = "FR0011550185-XPAR"

[[instrument]]
id = "ETF_WORLD"
name = "Amundi MSCI World (PEA)"
asset_type = "ETF"
data_type = "BAR"
currency = "EUR"
primary_source = "YAHOO"
source_symbol = "CW8.PA"
calendar_id = "XPAR"
tradable = true
# Whole shares, as above: the lot size is a fact about the venue and the
# broker, and a backtest that ignores it allocates its capital more perfectly
# than any account could.
quantity_step = 1.0
# The share class listed on 18 April 2018, the first session with a real bar
# (volume 309, an open apart from its close). Yahoo serves 74 sessions before
# it, from 2018-01-02 to 2018-04-17, every one of them flat at a single value
# with no volume: net asset values published before there was a market. Stored
# as bars they were prices nobody could have traded, and the first months of any
# momentum or volatility computed on them were fiction. The normalizer now
# refuses a row outside this window and names it.
first_session = 2018-04-18
# Accumulating (C) share class: no dividend ever reaches the holder, so an empty
# action feed is the expected state and not a provider losing them.
distribution_policy = "ACCUMULATING"

  # Yahoo reports no split for CW8, so its bars are raw (checked 2026-09-13).
  # Euronext serves about two years only: older sessions stay SINGLE_SOURCE.
  [[instrument.check_sources]]
  source = "EURONEXT"
  source_symbol = "LU1681043599-XPAR"

# VIX is a published index, not an exchange-traded series, and modelling it as
# bars on XNYS was simply wrong: Cboe computes it on days NYSE is closed
# (2026-05-25, 2026-09-07), so the normalizer refused the whole download. Two
# independent sources agree on those days - Yahoo's ^VIX close and FRED's
# VIXCLS both give 15.30 on 2026-09-07 - so the values are real and it is the
# venue-session model that does not fit them.
#
# FRED's VIXCLS is the official Cboe close and needs no calendar. ALFRED
# vintages checked on 2026-09-18 show it published same day: the 2026-09-17
# vintage already carries the 2026-09-17 value, unlike DGS10, whose vintage of
# a day stops at the day before. The release time is the 16:15 New York options
# close, when the index is final, the same convention as the H.15 rate above.
# The open, high and low are lost with the switch; VIX is signal-only and never
# traded here, so nothing used them.
[[instrument]]
id = "VIX"
name = "CBOE Volatility Index"
asset_type = "VOLATILITY"
data_type = "LEVEL"
currency = "NA"
primary_source = "FRED"
source_symbol = "VIXCLS"
tradable = false
first_session = 1990-01-02

  [instrument.publication_rule]
  publication_time = "16:15:00"
  timezone = "America/New_York"

[[instrument]]
id = "US10Y"
name = "US 10-year Treasury constant maturity rate"
asset_type = "RATE"
data_type = "LEVEL"
currency = "NA"
primary_source = "FRED"
source_symbol = "DGS10"
tradable = false
first_session = 1990-01-02

  # H.15 is released at 16:15 New York, but ALFRED vintages show the value for a
  # day D first appearing the next business day: D = 2024-12-19 in the 12-20
  # vintage, and Friday 2024-12-20 in the Monday 12-23 vintage. The lag is
  # counted on XNYS sessions - a proxy for Federal Reserve business days that
  # errs on the late side (Good Friday is a session for the Fed and not for
  # NYSE), which is the only safe direction for an availability instant.
  [instrument.publication_rule]
  publication_time = "16:15:00"
  timezone = "America/New_York"
  lag_sessions = 1
  calendar_id = "XNYS"

[[instrument]]
id = "ECB_EURUSD"
name = "ECB euro reference exchange rate, USD"
asset_type = "FX"
data_type = "LEVEL"
currency = "USD"
primary_source = "ECB"
source_symbol = "EXR.D.USD.EUR.SP00.A"
tradable = false
first_session = 1999-01-04

  # Published around 16:00 CET for the same day, so no lag and no calendar.
  [instrument.publication_rule]
  publication_time = "16:00:00"
  timezone = "Europe/Paris"
