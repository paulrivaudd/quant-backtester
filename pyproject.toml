[project]
name = "quant-backtester"
version = "0.1.0"
description = "A daily-frequency, look-ahead-safe backtesting framework for systematic strategies."
readme = "README.md"
requires-python = ">=3.12,<3.13"
classifiers = [
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "scipy>=1.18.1",
    "yfinance>=1.7.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "exchange-calendars>=4.13.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "ANN",  # flake8-annotations
    "D",    # pydocstyle
    "NPY",  # numpy-specific rules
    "PD",   # pandas-vet
    "RUF",  # ruff-specific rules
]
ignore = [
    "D107",  # __init__ docstring: covered by the class docstring
    "D203",  # incompatible with D211
    "D213",  # incompatible with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D103", "ANN001", "ANN201"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    # Offline by default; run the live provider checks with `uv run pytest -m network`.
    "-m",
    "not network",
]
markers = [
    "slow: tests that take more than a second",
    "network: tests that hit a live data provider (deselected by default, run with -m network)",
]
filterwarnings = ["error"]

[tool.pyright]
include = ["src", "tests", "scripts"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"
# pandas and pyarrow ship partial stubs; a missing one is not a finding we act on.
reportMissingTypeStubs = false
